<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>기출 PDF → 문제은행 HTML 자동 변환기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --ok: #16a34a;
    --text: #0f172a;
    --muted: #64748b;
    --border: #cbd5e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.55;
  }
  .top-bar {
    background: #0f172a; color: #fff;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .top-bar a {
    color: #93c5fd; text-decoration: none; font-size: 13px; font-weight: 700;
  }
  .container {
    max-width: 820px;
    margin: 20px auto 60px;
    padding: 0 16px;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    margin-bottom: 16px;
  }
  h1 { margin: 0 0 6px; font-size: 20px; }
  .sub { margin: 0 0 16px; font-size: 13.5px; color: var(--muted); }
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  label.fld { display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 4px; }
  input[type="text"], select, textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .drop-zone {
    border: 2px dashed #93c5fd;
    background: #eff6ff;
    border-radius: 12px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .drop-zone:hover, .drop-zone.dragover {
    background: #dbeafe;
    border-color: var(--primary);
  }
  .drop-zone p { margin: 6px 0 0; font-size: 13px; color: #1e40af; }
  .btn-row {
    display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px;
  }
  button.btn {
    border: none; border-radius: 10px;
    padding: 11px 18px;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-sub { background: #e2e8f0; color: #1e293b; }
  .q-edit-card {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    background: #f8fafc;
  }
  .q-edit-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-weight: 800; font-size: 14px;
  }
  .opt-grid {
    display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 8px;
  }
  .opt-row {
    display: flex; align-items: center; gap: 8px;
  }
  .opt-row input[type="radio"] { transform: scale(1.15); }
  .status-msg {
    font-size: 13px; font-weight: 700; color: #1d4ed8; margin-top: 10px;
  }
</style>
</head>
<body>

<div class="top-bar">
  <strong>⚙️ 기출 PDF → 문제은행 HTML 로컬 변환기</strong>
  <a href="./index.html">← 7과목 대문으로</a>
</div>

<div class="container">
  <div class="card">
    <h1>기출문제 PDF 업로드 및 자동 파싱</h1>
    <p class="sub">서버 전송 없이 브라우저 내에서만 텍스트를 추출하여 동일한 타이머·A~D 진단 기능의 퀴즈 HTML을 생성합니다.</p>

    <div class="meta-grid">
      <div>
        <label class="fld">과목명 선택 또는 입력</label>
        <select id="subjSelect" onchange="syncSubjectName()">
          <option value="컴퓨터구조">1. 컴퓨터구조</option>
          <option value="시뮬레이션" selected>2. 시뮬레이션</option>
          <option value="클라우드컴퓨팅">3. 클라우드컴퓨팅</option>
          <option value="AI리터러시">4. AI리터러시</option>
          <option value="컴퓨터과학 개론">5. 컴퓨터과학 개론</option>
          <option value="컴파일러구성">6. 컴파일러구성</option>
          <option value="오픈소스기반데이터분석">7. 오픈소스기반데이터분석</option>
        </select>
      </div>
      <div>
        <label class="fld">시험 제목 (상단 표시용)</label>
        <input type="text" id="examTitle" value="시뮬레이션 기출 문제은행">
      </div>
      <div>
        <label class="fld">저장 파일명 (.html)</label>
        <input type="text" id="fileName" value="simulation_quiz.html">
      </div>
    </div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
      <strong>📄 여기를 클릭하거나 기출 PDF 파일을 끌어다 놓으세요</strong>
      <p>텍스트 선택이 가능한 기출문제 PDF 지원 (문항 번호 및 ①②③④ 보기 자동 분리)</p>
      <input type="file" id="pdfInput" accept="application/pdf" style="display:none" onchange="handleFile(this.files[0])">
    </div>
    <div class="status-msg" id="statusMsg"></div>

    <details style="margin-top:14px;">
      <summary style="cursor:pointer; font-size:13px; font-weight:700; color:#475569;">📋 추출된 원문 텍스트 직접 붙여넣기 / 수정하기</summary>
      <textarea id="rawText" rows="7" placeholder="PDF를 올리면 원문이 여기에 추출됩니다. 직접 텍스트를 붙여넣고 [텍스트 다시 분석]을 누를 수도 있습니다." style="margin-top:8px;"></textarea>
      <div class="btn-row">
        <button type="button" class="btn btn-sub" onclick="parseRawText()">텍스트 다시 분석</button>
      </div>
    </details>
  </div>

  <div class="card" id="previewCard" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
      <div>
        <h2 style="margin:0; font-size:18px;" id="previewTitle">추출된 문항 미리보기 및 정답 지정</h2>
        <p style="margin:2px 0 0; font-size:12.5px; color:#64748b;">정답 라디오버튼을 확인/체크한 뒤 아래 다운로드 버튼을 누르세요.</p>
      </div>
      <button type="button" class="btn btn-ok" onclick="downloadQuizHtml()">⬇️ 완성된 퀴즈 HTML 다운로드</button>
    </div>

    <div id="editList"></div>

    <div class="btn-row" style="justify-content:flex-end;">
      <button type="button" class="btn btn-sub" onclick="addEmptyQuestion()">+ 문항 수동 추가</button>
      <button type="button" class="btn btn-ok" onclick="downloadQuizHtml()">⬇️ 완성된 퀴즈 HTML 다운로드</button>
    </div>
  </div>
</div>

<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

let parsedQuestions = [];

function syncSubjectName() {
  const s = document.getElementById("subjSelect").value;
  const slugMap = {
    "컴퓨터구조": "computer_arch",
    "시뮬레이션": "simulation",
    "클라우드컴퓨팅": "cloud_computing",
    "AI리터러시": "ai_literacy",
    "컴퓨터과학 개론": "intro_cs",
    "컴파일러구성": "compiler",
    "오픈소스기반데이터분석": "opensource_data"
  };
  document.getElementById("examTitle").value = `${s} 기출 문제은행`;
  document.getElementById("fileName").value = `${slugMap[s] || "quiz"}_quiz.html`;
}

const dz = document.getElementById("dropZone");
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("dragover"); });
dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
dz.addEventListener("drop", e => {
  e.preventDefault();
  dz.classList.remove("dragover");
  if (e.dataTransfer.files && e.dataTransfer.files[0]) {
    handleFile(e.dataTransfer.files[0]);
  }
});

async function handleFile(file) {
  if (!file) return;
  const status = document.getElementById("statusMsg");
  status.textContent = `⏳ '${file.name}'에서 텍스트를 추출하는 중...`;
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      let lastY = null;
      let pageLines = [];
      let curLine = "";
      for (const item of content.items) {
        const y = item.transform ? item.transform[5] : 0;
        if (lastY !== null && Math.abs(y - lastY) > 5) {
          pageLines.push(curLine.trim());
          curLine = item.str;
        } else {
          curLine += (curLine && !curLine.endsWith(" ") ? " " : "") + item.str;
        }
        lastY = y;
      }
      if (curLine.trim()) pageLines.push(curLine.trim());
      fullText += pageLines.join("\n") + "\n\n";
    }
    document.getElementById("rawText").value = fullText;
    if (fullText.trim().length < 50) {
      status.textContent = "⚠️ 추출된 텍스트가 거의 없습니다. 스캔된 이미지 PDF인 경우 텍스트 인식이 불가합니다.";
      return;
    }
    parseRawText();
  } catch (err) {
    status.textContent = "❌ PDF 읽기 오류: " + err.message;
  }
}

function parseRawText() {
  const raw = document.getElementById("rawText").value;
  const status = document.getElementById("statusMsg");

  const ansMap = {};
  const circleToIdx = { "①": 0, "②": 1, "③": 2, "④": 3, "1": 0, "2": 1, "3": 2, "4": 3 };
  const ansSectionMatch = raw.match(/(?:정\s*답|모범답안)[\s\S]{0,1500}$/);
  if (ansSectionMatch) {
    const ansMatches = ansSectionMatch[0].matchAll(/(\d{1,2})\s*[\.\):]?\s*([①②③④1-4])/g);
    for (const m of ansMatches) {
      const qn = parseInt(m[1], 10);
      if (qn >= 1 && qn <= 70 && circleToIdx[m[2]] !== undefined) {
        ansMap[qn] = circleToIdx[m[2]];
      }
    }
  }

  const cleanBody = ansSectionMatch ? raw.slice(0, ansSectionMatch.index) : raw;
  const blocks = cleanBody.split(/\n(?=\s*\d{1,2}\s*[\.\)]\s+)/);

  const questions = [];
  for (const blk of blocks) {
    const mNum = blk.match(/^\s*(\d{1,2})\s*[\.\)]\s+([\s\S]+)/);
    if (!mNum) continue;
    const num = parseInt(mNum[1], 10);
    const body = mNum[2].trim();

    const optIdx1 = body.indexOf("①");
    const optIdx2 = body.indexOf("②");
    const optIdx3 = body.indexOf("③");
    const optIdx4 = body.indexOf("④");

    if (optIdx1 !== -1 && optIdx2 !== -1 && optIdx3 !== -1 && optIdx4 !== -1) {
      const qText = body.slice(0, optIdx1).replace(/\n+/g, "<br>").trim();
      const o1 = body.slice(optIdx1 + 1, optIdx2).replace(/\s+/g, " ").trim();
      const o2 = body.slice(optIdx2 + 1, optIdx3).replace(/\s+/g, " ").trim();
      const o3 = body.slice(optIdx3 + 1, optIdx4).replace(/\s+/g, " ").trim();
      const o4 = body.slice(optIdx4 + 1).replace(/\s+/g, " ").trim();

      questions.push({
        num,
        unit: "전 범위",
        q: qText,
        options: [o1, o2, o3, o4],
        ans: ansMap[num] !== undefined ? ansMap[num] : 0,
        exp: "기출문제 해설을 입력하세요."
      });
    }
  }

  parsedQuestions = questions;
  if (questions.length === 0) {
    status.textContent = "⚠️ 자동 분리된 객관식 문항이 없습니다. 원문 형식을 확인하거나 문항을 수동 추가해 주세요.";
  } else {
    const autoAnsCnt = Object.keys(ansMap).length;
    status.textContent = `✅ 총 ${questions.length}문항이 자동 추출되었습니다! (자동 매칭된 정답: ${autoAnsCnt}개)`;
  }
  renderEditor();
}

function renderEditor() {
  const card = document.getElementById("previewCard");
  const list = document.getElementById("editList");
  card.style.display = "block";
  document.getElementById("previewTitle").textContent = `추출된 문항 편집 및 정답 확인 (${parsedQuestions.length}문항)`;

  const circles = ["①", "②", "③", "④"];
  list.innerHTML = parsedQuestions.map((item, idx) => `
    <div class="q-edit-card">
      <div class="q-edit-head">
        <span>문제 ${item.num}</span>
        <input type="text" value="${escapeAttr(item.unit)}" onchange="parsedQuestions[${idx}].unit=this.value" style="width:180px; padding:4px 8px; font-size:12px;" placeholder="단원명">
      </div>
      <textarea rows="2" onchange="parsedQuestions[${idx}].q=this.value.replace(/\\n/g,'<br>')">${item.q.replace(/<br>/g, "\n")}</textarea>
      <div class="opt-grid">
        ${item.options.map((opt, oIdx) => `
          <div class="opt-row">
            <input type="radio" name="ans_${idx}" ${item.ans === oIdx ? "checked" : ""} onchange="parsedQuestions[${idx}].ans=${oIdx}">
            <span style="font-weight:700; font-size:13px;">${circles[oIdx]}</span>
            <input type="text" value="${escapeAttr(opt)}" onchange="parsedQuestions[${idx}].options[${oIdx}]=this.value">
          </div>
        `).join("")}
      </div>
      <div style="margin-top:8px;">
        <input type="text" value="${escapeAttr(item.exp)}" onchange="parsedQuestions[${idx}].exp=this.value" placeholder="해설 입력 (선택)" style="font-size:12.5px; background:#fff;">
      </div>
    </div>
  `).join("");
}

function addEmptyQuestion() {
  const nextNum = parsedQuestions.length + 1;
  parsedQuestions.push({
    num: nextNum,
    unit: "전 범위",
    q: "새 문제 내용을 입력하세요.",
    options: ["보기 1", "보기 2", "보기 3", "보기 4"],
    ans: 0,
    exp: ""
  });
  renderEditor();
}

function escapeAttr(str) {
  return String(str || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function downloadQuizHtml() {
  if (parsedQuestions.length === 0) {
    alert("변환할 문항이 없습니다.");
    return;
  }
  const subj = document.getElementById("subjSelect").value;
  const title = document.getElementById("examTitle").value || `${subj} 기출 문제은행`;
  const fname = document.getElementById("fileName").value || "quiz.html";
  const total = parsedQuestions.length;
  const qJson = JSON.stringify(parsedQuestions).replace(/<\/script>/gi, "<\\/script>");

  const htmlOutput = buildStandaloneQuizHtml(subj, title, total, qJson);
  const blob = new Blob([htmlOutput], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fname.endsWith(".html") ? fname : fname + ".html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildStandaloneQuizHtml(subj, title, total, qJson) {
  return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>${subj} 기출 (${total}문항)</title>
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="top-bar">
  <div class="top-left">
    <a class="btn-home" href="../index.html">← 메인</a>
    <div>
      <div class="top-title">${subj} 기출 (${total}문항)</div>
    <div class="top-sub" id="answered-count">진행: 0 / ${total} 문항</div>
    </div>
  </div>
  <div class="timer-box">
    <span class="timer-val" id="timer">00:00</span>
    <button class="btn-pause" id="pauseBtn" onclick="togglePause()">일시정지</button>
  </div>
</div>
<div class="container">
  <div class="intro-card">
    <h2>${title}</h2>
    <p>라디오버튼으로 정답을 선택하고, 필요시 하단의 <b>A~D 유형</b>을 체크하세요.<br>
    (A: 개념 알고 품 / B: 원리 모름 / C: 개념 생소 / D: 계산·적용 막힘)</p>
    <div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
  <div id="quiz-list"></div>
  <div class="submit-area">
    <button class="btn-submit" onclick="gradeQuiz()">제출 및 학습 진단 보고서 생성</button>
  </div>
  <div class="report-card" id="report-section">
    <h3>📊 학습 진단 및 속도 분석 보고서</h3>
    <div class="stat-grid" id="stat-grid"></div>
    <div id="unit-breakdown"></div>
    <h3 style="font-size:15px; margin-top:16px;">📋 요약 보고서</h3>
    <textarea class="report-text" id="report-textarea" readonly></textarea>
    <button class="btn-copy" onclick="copyReport()">보고서 텍스트 복사하기</button>
    <a class="btn-home-bottom" href="../index.html">🏠 과목 메인 포털로 돌아가기</a>
  </div>
</div>
<script>
const QUESTIONS = ${qJson};
const TOTAL = QUESTIONS.length;
const userAns = new Array(TOTAL).fill(null);
const userType = new Array(TOTAL).fill(null);
let seconds = 0, paused = false, submitted = false;
const timerInterval = setInterval(() => {
  if (!paused && !submitted) { seconds++; document.getElementById("timer").textContent = formatTime(seconds); }
}, 1000);
function formatTime(sec) {
  return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
}
function togglePause() {
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "재개" : "일시정지";
}
function renderQuiz() {
  const list = document.getElementById("quiz-list");
  const numCircles = ["①", "②", "③", "④"];
  list.innerHTML = QUESTIONS.map((item, idx) => \`
    <div class="q-card" id="card-\${idx}">
      <div class="q-meta"><span class="q-num">문제 \${item.num}</span><span class="q-unit">\${item.unit}</span></div>
      <div class="q-text">\${item.q}</div>
      <div class="opt-list">
        \${item.options.map((opt, oIdx) => \`
          <label class="opt-label" id="lbl-\${idx}-\${oIdx}">
            <input type="radio" name="q\${idx}" value="\${oIdx}" onchange="selectOpt(\${idx}, \${oIdx})">
            <span>\${numCircles[oIdx]} \${opt}</span>
          </label>
        \`).join("")}
      </div>
      <div class="type-row">
        <span class="type-title">자가 유형 분류:</span>
        <div class="type-btns">
          \${["A", "B", "C", "D"].map(t => \`<button type="button" class="t-btn" id="tbtn-\${idx}-\${t}" onclick="selectType(\${idx}, '\${t}')">\${t}</button>\`).join("")}
        </div>
      </div>
      <div class="exp-box" id="exp-\${idx}"><b>정답: \${numCircles[item.ans]}</b><br>\${item.exp}</div>
    </div>
  \`).join("");
}
function selectOpt(qIdx, oIdx) {
  if (submitted) return;
  userAns[qIdx] = oIdx;
  for (let i = 0; i < 4; i++) document.getElementById(\`lbl-\${qIdx}-\${i}\`).classList.toggle("selected", i === oIdx);
  const done = userAns.filter(v => v !== null).length;
  document.getElementById("answered-count").textContent = \`진행: \${done} / \${TOTAL} 문항\`;
  document.getElementById("progress-fill").style.width = \`\${(done / TOTAL) * 100}%\`;
}
function selectType(qIdx, t) {
  userType[qIdx] = (userType[qIdx] === t) ? null : t;
  ["A", "B", "C", "D"].forEach(code => document.getElementById(\`tbtn-\${qIdx}-\${code}\`).classList.toggle("active", userType[qIdx] === code));
}
function gradeQuiz() {
  const unanswered = userAns.filter(v => v === null).length;
  if (unanswered > 0 && !confirm(\`아직 풀지 않은 문제가 \${unanswered}개 있습니다. 그래도 제출하고 진단할까요?\`)) return;
  submitted = true;
  clearInterval(timerInterval);
  let correctCnt = 0;
  const unitStats = {}, typeStats = { A: [], B: [], C: [], D: [] }, wrongList = [];
  QUESTIONS.forEach((item, idx) => {
    if (!unitStats[item.unit]) unitStats[item.unit] = { total: 0, ok: 0 };
    unitStats[item.unit].total++;
    const card = document.getElementById(\`card-\${idx}\`);
    document.getElementById(\`exp-\${idx}\`).classList.add("show");
    const chosen = userAns[idx], isOk = chosen === item.ans;
    if (isOk) { correctCnt++; unitStats[item.unit].ok++; card.classList.add("correct"); }
    else {
      card.classList.add("wrong"); wrongList.push(item.num);
      if (chosen !== null) document.getElementById(\`lbl-\${idx}-\${chosen}\`).classList.add("ans-bad");
    }
    document.getElementById(\`lbl-\${idx}-\${item.ans}\`).classList.add("ans-ok");
    const finalType = userType[idx] || (isOk ? "A" : "B");
    typeStats[finalType].push(item.num);
  });
  const score = Math.round((correctCnt / TOTAL) * 100), avgSec = Math.round(seconds / TOTAL);
  document.getElementById("stat-grid").innerHTML = \`
    <div class="stat-box"><div class="stat-num">\${correctCnt} / \${TOTAL} (\${score}점)</div><div class="stat-lbl">정답 수 및 환산 점수</div></div>
    <div class="stat-box"><div class="stat-num">\${formatTime(seconds)}</div><div class="stat-lbl">총 소요 시간 (문항당 \${avgSec}초)</div></div>
    <div class="stat-box"><div class="stat-num">A:\${typeStats.A.length} / B:\${typeStats.B.length}</div><div class="stat-lbl">유형 A(완벽) / B(원리부족)</div></div>
    <div class="stat-box"><div class="stat-num">C:\${typeStats.C.length} / D:\${typeStats.D.length}</div><div class="stat-lbl">유형 C(생소) / D(계산·적용)</div></div>
  \`;
  let unitHtml = "<h3 style='font-size:15px; margin:12px 0 6px;'>📚 단원별 성취도</h3><table class='mini-tbl' style='width:100%;'><tr><th>단원</th><th>정답/문항</th><th>정답률</th></tr>";
  const unitLines = [];
  for (const [u, st] of Object.entries(unitStats)) {
    const pct = Math.round((st.ok / st.total) * 100);
    unitHtml += \`<tr><td style='text-align:left;'>\${u}</td><td>\${st.ok} / \${st.total}</td><td><b>\${pct}%</b></td></tr>\`;
    unitLines.push(\`- \${u}: \${st.ok}/\${st.total} (\${pct}%)\`);
  }
  unitHtml += "</table>";
  document.getElementById("unit-breakdown").innerHTML = unitHtml;
  const speedEval = avgSec <= 60 ? "빠름 (실전 시간 충분)" : avgSec <= 90 ? "적정 (계산 문항 시간 배분 유의)" : "다소 느림 (개념 정립 후 반복 숙달 필요)";
  document.getElementById("report-textarea").value = \`[${title} 학습 진단 보고서]
1. 학습 범위 및 문항 수: 전 범위 \${TOTAL}문항
2. 실제 풀이 시간: 총 \${formatTime(seconds)} (문항당 평균 \${avgSec}초)
3. 득점 결과: \${correctCnt} / \${TOTAL}문항 정답 (\${score}점)
4. A~D 유형 분포:
   - A (개념 알고 품): \${typeStats.A.length}문항 \${typeStats.A.length ? '(' + typeStats.A.join(', ') + '번)' : ''}
   - B (원리 부족): \${typeStats.B.length}문항 \${typeStats.B.length ? '(' + typeStats.B.join(', ') + '번)' : ''}
   - C (개념 생소): \${typeStats.C.length}문항 \${typeStats.C.length ? '(' + typeStats.C.join(', ') + '번)' : ''}
   - D (계산·적용 막힘): \${typeStats.D.length}문항 \${typeStats.D.length ? '(' + typeStats.D.join(', ') + '번)' : ''}
5. 단원별 정답률:
\${unitLines.join("\\n")}
6. 오답 문항(재풀이 대상): \${wrongList.length ? wrongList.join(", ") + "번" : "없음 (만점)"}
7. 학습 속도 평가: \${speedEval}\`;
  const repSec = document.getElementById("report-section");
  repSec.style.display = "block";
  repSec.scrollIntoView({ behavior: "smooth" });
}
function copyReport() {
  const ta = document.getElementById("report-textarea");
  ta.select();
  document.execCommand("copy");
  alert("진단 보고서가 클립보드에 복사되었습니다!");
}
renderQuiz();
document.querySelectorAll('.mini-tbl').forEach(tbl => {
  if (!tbl.closest('.mem-wrap') && !tbl.parentElement.classList.contains('tbl-wrap')) {
    const wrap = document.createElement('div');
    wrap.className = 'tbl-wrap';
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  }
});
<\/script>
</body>
</html>`;
}
</script>
</body>
</html>
