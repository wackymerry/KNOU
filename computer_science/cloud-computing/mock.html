 컴퓨팅", "클라이언트-서버 → 메인 프레임 → 그리드 컴퓨팅 → 클라우드 컴퓨팅"], "ans": 2, "exp": "컴퓨팅 기술은 1980년대부터 약 10년 주기로 메일프레임, 클라이언트-서버, 그리드 컴퓨팅, 클라우드 컴퓨팅 순서로 발전하였다."}, {"unit": "1장 클라우드 컴퓨팅의 이해", "source": "강의 2강 1번", "q": "정보 서비스 제공에 필요한 데이터 센터의 하드웨어와 소프트웨어 설비를 조직이 직접 보유·운영하는 방식을 무엇이라고 하는가?", "options": ["클라우드", "프로비저닝", "오프프레미스", "온프레미스"], "ans": 3, "exp": "온프레미스란 하드웨어 및 소프트웨어 등을 클라우드 같이 원격 환경이 아닌 자체적으로 보유한 전산실 서버에 직접 설치해 운영하는 방식을 말한다."}, {"unit": "1장 클라우드 컴퓨팅의 이해", "source": "강의 2강 2번", "q": "CSP와 사용자가 가용성 등 서비스 수준을 정량적 지표로 합의하고, 기준 미달 시의 보상이나 서비스 크레딧 등의 처리 기준을 정하는 계약은 무엇인가?", "options": ["MOU", "SLA", "RFP", "각서"], "ans": 1, "exp": "SLA(Service Level Agreement)는 CSP와 사용자 사이에 서비스 제공 범위, 가용성, 장애 대응, 유지보수 및 합의한 서비스 수준을 충족하지 못한 경우의 보상 기준 등을 정한 서비스 수준 계약이다."}, {"unit": "1장 클라우드 컴퓨팅의 이해", "source": "강의 2강 3번", "q": "클라우드 배포 모델 중 다수의 사용자가 CSP가 제공하는 서버와 저장소 등의 리소스를 공유하여 사용하는 모델은 무엇인가?", "options": ["프라이빗 클라우드", "퍼블릭 클라우드", "하이브리드 클라우드", "커뮤티니 클라우드"], "ans": 1, "exp": "클라우드 시스템 배포 모델에는 프라이빗 클라우드, 퍼블릭 클라우드, 하이브리드 클라우드, 커뮤티니 클라우드가 있으며 이 중 퍼블릭 클라우드는 다수의 사용자가 IT 리소스를 공유하는 사용하는 모델이다."}, {"unit": "1장 클라우드 컴퓨팅의 이해", "source": "강의 3강 1번", "q": "<blockquote>소비자에게 온디맨드 방식으로 IT 리소스를 실시간 및 동적으로 할당하는 특성</blockquote>다음 위 지문의 내용은 클라우드 컴퓨팅의 어떤 장점에 대한 설명인가?", "options": ["탄력성", "가용성", "신속성", "경제성"], "ans": 0, "exp": "탄력성은 서비스 요구량의 변화에 따라 IT 리소스를 동적으로 확대하거나 축소할 수 있는 능력을 말한다. 필요한 만큼 리소스를 이용할 수 있으므로 과도한 리소스 확보와 초기 IT 투자 부담을 줄일 수 있다."}, {"unit": "1장 클라우드 컴퓨팅의 이해", "source": "강의 3강 2번", "q": "<blockquote>● 컴퓨팅 리소스가 플랫폼 상에서 논리적 리소스풀로 등록되어 풀에 포함된 리소스가 집합적으로 고성능의 컴퓨팅 환경을 제공하는 기술 ● 리소스의 결합성이 매우 작고, 서로 다른 기종의 리소스들이 물리적으로 분산되어 있음</blockquote>다음 위 지문은 클라우드 컴퓨팅의 관련 기술 중 어떤 기술에 대한 설명인가?", "options": ["클러스터링 기술", "그리드 컴퓨팅 기술", "가상화 기술", "서버리스 컴퓨팅 기술"], "ans": 1, "exp": "그리드 컴퓨팅은 물리적으로 분산된 이기종 컴퓨팅 리소스를 논리적 리소스 풀로 결합하여 집합적으로 활용하는 기술이다. 네트워크 접근, 리소스 풀링, 확장성 및 탄력성 측면에서 클라우드 컴퓨팅 발전에 기여하였다."}, {"unit": "1장 클라우드 컴퓨팅의 이해", "source": "강의 3강 3번", "q": "중소기업 관점에서 클라우드 컴퓨팅의 도입 효과로 가장 적절한 것은?", "options": ["초기 시스템 구축 비용이 증가한다.", "전문 시스템 운영 인력이 더 많이 필요하다.", "IT 운영 부담을 줄이고 경영 자원을 핵심역량에 집중할 수 있다.", "자체 데이터 센터 구축에 필요한 기간이 증가한다."], "ans": 2, "exp": "중소기업은 투자 여력과 전문 운영 인력이 부족한 경우가 많다. 클라우드 컴퓨팅을 이용하면 시스템 구축·운영 비용과 전문 인력 부담을 줄이고, 제한된 경영 자원을 기업의 핵심역량에 집중할 수 있다."}, {"unit": "1장 클라우드 컴퓨팅의 이해", "source": "강의 4강 1번", "q": "다음 중 클라우드 환경의 보안에 대한 설명으로 가장 적절한 것은?", "options": ["데이터 보안은 전적으로 CSP가 책임진다.", "클라우드를 이용하면 모든 보안 취약성이 제거된다.", "데이터 보안에 대한 책임은 CSP와 사용자에게 나누어질 수 있다.", "클라우드에서는 네트워크를 이용하지 않으므로 통신 공격의 위험이 없다."], "ans": 2, "exp": "클라우드에서는 기업의 데이터가 CSP의 리소스에 저장·처리되므로 보안에 대한 역할과 책임을 CSP와 사용자가 나누게 된다. 또한 원격 네트워크를 이용하므로 통신 도청, 중간자 공격, 스푸핑 등의 보안 위험도 함께 고려해야 한다."}, {"unit": "1장 클라우드 컴퓨팅의 이해", "source": "강의 4강 2번", "q": "특정 CSP의 독자적인 서비스에 의존하여 다른 CSP로 시스템을 이전하기 어려워지는 현상은?", "options": ["리소스 풀링", "벤더 락인", "오토 스케일링", "로드 밸런싱"], "ans": 1, "exp": "CSP마다 서비스 구성, API, 관리 방식 및 데이터 형식 등이 다를 수 있다. 특정 CSP의 독자적인 서비스에 시스템이 지나치게 의존하면 다른 CSP로 이전하기 어려워지는 벤더 락인(Vendor Lock-in)이 발생할 수 있다."}, {"unit": "1장 클라우드 컴퓨팅의 이해", "source": "강의 4강 3번", "q": "클라우드와 온프레미스의 비용을 비교할 때 가장 적절한 방법은?", "options": ["클라우드의 월 이용요금만 비교한다.", "서버 구입비만 비교한다.", "초기 구축비용만 비교한다.", "이전·수정·운영 비용까지 포함한 총소유비용을 비교한다."], "ans": 3, "exp": "클라우드는 초기 투자비용을 줄일 수 있지만 장기간의 고부하 운영이나 데이터 마이그레이션, 기존 시스템 수정 등에 추가 비용이 발생할 수 있다. 따라서 월 이용요금만이 아니라 시스템의 전체 생애주기에 발생하는 총소유비용(TCO)을 기준으로 비교해야 한다."}, {"unit": "2장 클라우드 컴퓨팅 서비스", "source": "강의 5강 1번", "q": "리소스를 CSP 담당자의 직접적인 개입 없이 사용자가 필요할 때 자동으로 확보하는 특성은 무엇인가?", "options": ["광범위 네트워크 액세스", "리소스 풀링", "서비스 사용량 측정", "온디맨드 셀프서비스"], "ans": 3, "exp": "온디맨드 셀프서비스는 사용자가 서비스 제공자와 직접 협의하지 않고 클라우드 관리 포털 등을 통해 필요한 리소스를 자동으로 요청하고 할당받는 특성이다."}, {"unit": "2장 클라우드 컴퓨팅 서비스", "source": "강의 5강 2번", "q": "다음 중 리소스 풀링에 대한 설명으로 옳지 않은 것은?", "options": ["물리·가상 리소스를 공유 리소스 풀에서 통합 관리한다.", "사용자의 요청에 따라 필요한 리소스를 동적으로 할당한다.", "할당된 리소스는 특정 사용자가 지속적으로 소유하고 점유한다.", "사용이 끝난 리소스는 다시 공유 리소스 풀로 반환된다."], "ans": 2, "exp": "리소스 풀링에서는 리소스를 특정 사용자가 지속적으로 소유하거나 점유하지 않는다. 공유 풀의 리소스는 사용자 요구에 따라 동적으로 할당되며, 사용이 끝나면 다시 풀로 반환되어 다른 사용자나 서비스에 재할당된다."}, {"unit": "2장 클라우드 컴퓨팅 서비스", "source": "강의 5강 3번", "q": "다음 중 클라우드 컴퓨팅의 본질적 특성과 설명의 연결이 옳지 않은 것은?", "options": ["광범위 네트워크 액세스 - 다양한 단말에서 표준화된 네트워크 방식으로 서비스에 접근한다.", "신속한 탄력성 - 서비스 요구량에 따라 리소스를 신속하게 확장하거나 축소한다.", "서비스 사용량 측정 - 리소스 사용량을 측정하지 않고 모든 사용자에게 동일한 비용을 부과한다.", "온디맨드 셀프서비스 - 서비스 제공자의 직접적인 개입 없이 필요한 리소스를 확보한다."], "ans": 2, "exp": "서비스 사용량 측정은 스토리지, CPU, 네트워크 대역폭 등의 이용량을 측정하고 그 결과를 모니터링·제어·보고하는 특성이다. 측정된 이용량은 투명한 리소스 관리와 사용량 기반 비용 산정에 활용된다."}, {"unit": "2장 클라우드 컴퓨팅 서비스", "source": "강의 6강 1번", "q": "사용자가 애플리케이션과 데이터를 관리하고, CSP가 런타임·미들웨어·운영체제 및 하부 인프라를 관리하는 서비스 모델은?", "options": ["DBaaS", "IaaS", "PaaS", "SaaS"], "ans": 2, "exp": "PaaS는 애플리케이션의 개발·배포·실행에 필요한 플랫폼을 제공하는 서비스 모델이다. 사용자는 직접 개발한 애플리케이션과 데이터를 관리하고, CSP는 런타임, 미들웨어, 운영체제와 하부 인프라를 관리한다."}, {"unit": "2장 클라우드 컴퓨팅 서비스", "source": "강의 6강 2번", "q": "요청이나 이벤트가 발생할 때 등록된 함수 단위의 코드를 실행하고, 실행 리소스의 할당과 회수를 CSP가 관리하는 서비스 모델은 무엇인가?", "options": ["FaaS", "DBaaS", "CaaS", "IaaS"], "ans": 0, "exp": "FaaS는 애플리케이션의 개별 기능이나 함수를 클라우드에 등록하고 요청이나 이벤트가 발생할 때 실행하는 모델이다. 사용자는 서버와 운영체제를 직접 프로비저닝하지 않으며, 요청이 없을 때는 실행 리소스를 상시 점유하지 않는다."}, {"unit": "2장 클라우드 컴퓨팅 서비스", "source": "강의 6강 3번", "q": "공통된 업무 목적, 보안 요구사항, 정책이나 규제를 가진 여러 조직이 공동으로 이용하는 클라우드 배포 모델은 무엇인가?", "options": ["퍼블릭 클라우드", "하이브리드 클라우드", "프라이빗 클라우드", "커뮤니티 클라우드"], "ans": 3, "exp": "커뮤니티 클라우드는 공통된 업무 목적, 보안 요구사항, 정책이나 규제를 공유하는 여러 조직이 공동으로 사용하는 배포 모델이다. 일반 대중이 아니라 해당 커뮤니티에 참여하는 조직과 사용자만 접근한다."}, {"unit": "3장 클라우드 컴퓨팅 기술", "source": "강의 7강 1번", "q": "VM을 이미지와 설정 정보로 관리하는 가상화의 특성은?", "options": ["파티셔닝", "캡슐화", "격리", "하드웨어 독립성"], "ans": 1, "exp": "캡슐화는 VM과 컨테이너를 이미지·설정 정보로 관리하는 특성이다. 이를 통해 복제·배포·백업·복구가 쉬워진다."}, {"unit": "3장 클라우드 컴퓨팅 기술", "source": "강의 7강 2번", "q": "게스트 OS가 하이퍼콜로 제어를 요청하는 가상화 방식은?", "options": ["반가상화", "전가상화", "컨테이너 가상화", "에뮬레이션"], "ans": 0, "exp": "반가상화는 게스트 OS 또는 장치 드라이버가 하이퍼바이저와 협력하는 방식이다. 하이퍼콜로 제어 요청을 전달하여 명령 번역 부담을 줄인다."}, {"unit": "3장 클라우드 컴퓨팅 기술", "source": "강의 7강 3번", "q": "컨테이너가 VM보다 가볍고 시작이 빠른 이유는?", "options": ["게스트 OS를 별도로 실행한다.", "물리 서버를 전용으로 사용한다.", "실행에 필요한 라이브러리를 제외한다.", "호스트 OS 커널을 공유한다."], "ans": 3, "exp": "컨테이너는 호스트 OS 커널을 공유하여 별도의 게스트 OS를 실행하지 않는다. 따라서 VM보다 가볍고 시작 속도가 빠르다."}, {"unit": "3장 클라우드 컴퓨팅 기술", "source": "강의 8강 1번", "q": "네트워크 가상화의 장점이 아닌 것은?", "options": ["네트워크 보안 향상", "장비 구축 비용 절감", "설정·관리의 편의성 향상", "네트워크 분할마다 전용 장비 추가"], "ans": 3, "exp": "네트워크 가상화는 기존 네트워크를 논리적으로 분할하여 보안성을 높이고, 장비 추가 비용과 설정·관리 부담을 줄인다."}, {"unit": "3장 클라우드 컴퓨팅 기술", "source": "강의 8강 2번", "q": "VPN의 터널링에 대한 설명으로 옳은 것은?", "options": ["물리적 전용회선이 필수이다.", "패킷을 캡슐화해 공용망으로 전달한다.", "포트의 태그로 LAN을 분할한다.", "제어 기능과 패킷 전달 기능을 분리한다"], "ans": 1, "exp": "VPN은 패킷을 캡슐화하여 공용망으로 전달한다. IPsec 기반 VPN은 인증과 암호화를 통해 통신 데이터를 보호한다."}, {"unit": "3장 클라우드 컴퓨팅 기술", "source": "강의 8강 3번", "q": "방화벽 기능을 서버의 소프트웨어로 구현하는 기술은?", "options": ["VLAN", "VPN", "NFV", "SDN"], "ans": 2, "exp": "NFV는 전용 장비의 네트워크 기능을 소프트웨어로 구현한다. 이를 통해 기능을 신속하게 추가·변경하고 리소스를 탄력적으로 확장한다."}, {"unit": "3장 클라우드 컴퓨팅 기술", "source": "강의 9강 1번", "q": "다음 중 스토리지 관련 기술이라고 할 수 없는 것은?", "options": ["SDN", "RAID", "NAS", "SAN"], "ans": 0, "exp": "RAID는 다수의 디스크를 병렬적으로 구동하는 동시에 시스템의 신뢰성을 향상 시키는 기법이며, NAS와 SAN은 각각 네트워크 스위치를 통해 데이터를 송수신하는 저장장치, 데이터 저장 장치와 데이터를 사용할 서버를 파이버 채널 스위치로 연결한 고속 데이터 네트워크이다. 반면 SDN는 네트워크 가상화 기술의 일종이다."}, {"unit": "3장 클라우드 컴퓨팅 기술", "source": "강의 9강 2번", "q": "네트워크 가상화의 설명으로 올바른 것은?", "options": ["그룹의 이동없이 네트워크를 분할해야 하므로 복잡한 설정과 전문 네트워크 엔지니어 인력이 요구된다.", "네트워크 그룹의 이동없이 네트워크가 분할되어 오히려 네트워크 보안문제가 발생한다.", "네트워크 분할 시 스위치와 같은 추가적인 장비를 별도로 추가하지 않아도 되어 비용이 절감된다.", "네트워크 가상화 기술로는 DLT,  Docker와 같은 기술이 사용된다."], "ans": 2, "exp": "네트워크 가상화란 물리적 환경과 관계없이 논리적으로 여러개의 네트워크로 분할하는 기술을 의미한다. 네트워크의 보안성이 향상, 추가적인 네트워크 장치가 요구되지 않으며 설정 변경만으로 네트워크를 구성 및 관리할 수 있어 전문 엔지니어가 요구되지 않는 장점이 있다."}, {"unit": "3장 클라우드 컴퓨팅 기술", "source": "강의 9강 3번", "q": "시스템 구성 요소 중 정상적으로 동작하지 않으면 시스템 전체가 중단되는 지점 또는 장치는?", "options": ["하트비트 모니터링", "SAN", "장애 조치 시스템", "SPOF"], "ans": 3, "exp": "특정 장비 등의 장애로 전체 시스템이 기능하지 않는 지점을 SPOF(Single point of failure)라고 한다."}, {"unit": "4장 클라우드 아키텍처", "source": "강의 10강 1번", "q": "리소스 풀링에 대한 설명으로 올바른 것은?", "options": ["리소스를 특정 사용자에게 영구적으로 할당한다.", "요청이 발생할 때마다 물리 서버를 새로 구입한다.", "필요한 리소스를 할당하고 사용 후 풀로 반환한다.", "사용자가 리소스의 물리적 위치를 직접 관리한다."], "ans": 2, "exp": "리소스 풀링은 서버, 스토리지, 네트워크 등의 리소스를 미리 추상화하여 모아 두고, 필요에 따라 할당하고 회수하는 과정이다. 수요 변화에 신속하게 대응하고 유휴 리소스의 낭비를 줄일 수 있다."}, {"unit": "4장 클라우드 아키텍처", "source": "강의 10강 2번", "q": "다음 중 클라우드 아키텍처의 효율성과 가용성을 높이는 기술이 아닌 것은?", "options": ["로드 밸런싱", "리소스 풀링", "무정지 서비스 재배치", "가상 머신"], "ans": 3, "exp": "클라우드 아키텍처는 기존의 온 프레미스와 달리 리소스 풀링, 로드 밸런싱, 클라우드 버스팅, 무중단 서비스 재배치, 무정지 서비스 등을 통해 효율성과 가용성을 향상시킨다."}, {"unit": "4장 클라우드 아키텍처", "source": "강의 10강 3번", "q": "작업 부하를 여러 서버에 분산시켜 한 서버에 작업이 집중되지 않게 하는 방식의 스케일링 방법은?", "options": ["수평 스케일링", "수직 스케일링", "스케일 업", "스케일 다운"], "ans": 0, "exp": "유사한 장비를 추가해 작업을 나누는 것은 수평 스케일링(스케일 아웃)이다."}, {"unit": "4장 클라우드 아키텍처", "source": "강의 11강 1번", "q": "오토 스케일링을 위해 리소스 요청 또는 반환을 가능하도록 모니터링 중 특정 상황 발생 시 이벤트를 전달하는 것은?", "options": ["수평 스케일링", "클라우드 모니터", "가상 서버", "자동 확장 리스너"], "ans": 3, "exp": "자동 확장 리스너는 모니터링 조건이 충족될 때 이벤트를 전달하여 자원 추가 또는 반환을 시작하도록 한다."}, {"unit": "4장 클라우드 아키텍처", "source": "강의 11강 2번", "q": "다음 중 클라우드 버스팅에 대한 설명으로 올바르지 않은 것은?", "options": ["프라이빗 클라우드에 구성된 서비스 구조와 동일한 구성을 퍼블릭 클라우드에 구성", "버스트 인을 통해 데이터 동기화를 진행", "버스트 아웃을 통해 퍼블릭 클라우드의 데이터를 복제하여 프라이빗 클라우드로 전송", "클라우드 버스팅을 실행해야 할 임곗값 설정 및, 대상 데이터와 애플리케이션 설정"], "ans": 2, "exp": "클라우드 버스팅이란 프라이빗 클라우드와 동일하게 구성된 퍼블릭 클라우드에 임곗값 등 클라우드 버스팅을 사용하는 조건 만족 시 프라이빗 클라우드의 데이터 및 애플리케이션을 퍼블릭 클라우드로 전송하는 기술을 말한다. 이 때 프라이빗 클라우드에서 퍼블릭 클라우드로 확장하는 것을 버스트 아웃(burst out) 반대로 퍼블릭 클라우드 제거 후 프라이빗 클라우드 만 축소하는 것을 버스트 인(burst in)이라고 한다."}, {"unit": "4장 클라우드 아키텍처", "source": "강의 11강 3번", "q": "온프레미스 환경에서 가용성을 위한 이중화 방식 중 서버 두 대 중 하나만 운영 서버로 활용하고, 나머지 한 대는 장애 발생 시 운영 서버를 대체해서 작동하는 방식은?", "options": ["액티브-액티브", "액티브-스탠바이", "스탠바이-스탠바이", "스탠바이-액티브"], "ans": 1, "exp": "이중화 방식은 크게 액티브-액티브, 액티브-스탠바이 방식으로 구분되며 이 중 액티브-스탠바이는 한 서버는 운영에 사용하고 다른 한 서버는 운영쪽의 서버에 장애 시 대체하기 위해 대기하는 형식으로 구성하는 방식이다."}, {"unit": "5장 클라우드 컴퓨팅의 미래", "source": "강의 12강 1번", "q": "엣지 컴퓨팅 구조에서 중앙 클라우드에 해당하는 계층은?", "options": ["프런트 엔드", "니어 엔드", "파 엔드", "단말 계층"], "ans": 2, "exp": "강의자료 6쪽의 구조도에서 파 엔드는 중앙 클라우드에 해당한다. 대규모 연산과 저장 기능을 제공하며, 프런트 엔드와 니어 엔드에서 처리하기 어려운 빅데이터 관리나 머신러닝 작업을 수행한다."}, {"unit": "5장 클라우드 컴퓨팅의 미래", "source": "강의 12강 2번", "q": "사용자와 기기를 검증하여 최소 권한으로 필요한 애플리케이션에만 접근을 허용하는 기술은?", "options": ["CASB", "ZTNA", "SWG", "SD-WAN"], "ans": 1, "exp": "ZTNA는 제로 트러스트 원칙에 따라 사용자와 기기의 신원, 보안 상태, 접속 맥락을 검증한다. 검증 결과에 따라 허가된 애플리케이션에만 최소 권한으로 접근을 허용한다."}, {"unit": "5장 클라우드 컴퓨팅의 미래", "source": "강의 12강 3번", "q": "<img style=\"max-width:100%;height:auto\" alt=\"강의 문제 지문\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0EAAAIyCAYAAAANPMECAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAP+lSURBVHhe7N13gBxHmbDxp6p7ZjYnrbQr7SrnLFnJOWM5AAYTbHOACQYf4YgHGBsTPw644+DIx2Ey2MbggME5yFmylXPO0kqb807qrvr+6JkNo1UO3tW+P7ukVXdPb0/3hHq7qt5S9957r6WfuOmmmzIXCSGEEEIIIcRx0ZkLhBBCCCGEEOJsJkGQEEIIIYQQYkCRIEgIIYQQQggxoEgQJIQQQgghhBhQJAgSQgghhBBCDCjqpLLDzbuWm8ZmUb3iQRZt6bmqbN61XDy2AKfn4t7ZGFWrHubFzZkrepLscEIIIYQQQoiTdXJB0IJruWl0FtUrH2RRRgAz6fIbmFXUyKoHF7Gp56qe8s7jLW8eib/zPh57LXNlTxIECSGEEEIIIU5Wj+5w86+9iZtuOnx515tmdd/81Gjz8TOXCSGEEEIIIcRp0iMIev2x+7jvvl7KP3fTDoDpvrkQQgghhBBC9DvHlBghd0IBuUBL3ZrMVUIIIYQQQgjRrxzDmKAyznvzZYzMqmPN355hQ/dVZ8mYoOZoMnOREEIIIYQQ4igKs0OZi/qFowZBudOv5NqppcR2L+Ifi6t7rjxCEHS82eH2vf4wL+/MXNGTBEFCCCGEEEL0HWdnEJQ3icveNIsyVd17i84RgqDTQYIgIYQQQggh+o7+GgQdYUxQLpPmT6EsAonmavZmrhZCCCGEEEKIfugwLUG5jDz3EuaPKiDZHiOUGyK5fy1Pv7QplSUuJbMlaMG13DS6oPsWJyBx2JYlaQkSQgghhBCi7+ivLUHqpz/9aUYQVMD0hddzwbgCvP2vcP/DOxi58HouGJdLfNcSHnh0FS3pTS9/D5+YnMO+l+/m76t77qVXM6/n1gsHU3us22f4xCc+kbnolJAgSAghhBBCiOPXX4OgjO5wg5n7tndw8bgC4vtf4+8Pr6KFFtY++Xee29xCZNQFvPvGi5lQ2PNRQgghhBBCCNFfdAVBQ+by5ve/gwUVEVq2vcgDDy+jtnNlC1ueuYcHXttNvHgKc8+p7FwjhBBCCCGEEP1JZxA0Yc50Rua0s+OlB/jjk2u7urx1U7vsn/zxf/+Xexbty1yVYRbX3/oJbn3brMwVQgghhBBCCPGG6gyCtjz+W372v3/k8TVd7T+nXC8pGIQQQgghhBDiTDpCiuzTYM3fuftnJ5YUQQghhBBCCCFOhTMbBAkhhBBCCCHEG+y0BkGuG8lcJIQQQgghhBBvqF7mCToOl72HT0zJYd9Ld/P3NT1XzX3brSyoOJ4gqJENP7uHRZmLu5F5goQQQgghhOg7+us8QScXBJ1hEgQJIYQQQgjRd/TXIOi0docTQgghhBBCiL5G function shuffle(items) {
  const out = [...items];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
function drawExam() {
  let counts = {};
  try { counts = JSON.parse(localStorage.getItem("cloud118.counts")) || {}; } catch {}
  const pool = shuffle(BANK).sort((a,b) => (counts[a.source] || 0) - (counts[b.source] || 0));
  const selected = new Set();
  const units = shuffle(new Set(BANK.map(q => q.unit)));
  units.forEach((unit, index) => {
    const quota = index < 3 ? 5 : 4;
    pool.filter(q => q.unit === unit).slice(0, quota).forEach(q => selected.add(q));
  });
  const exam = shuffle(selected).map((q,i) => {
    counts[q.source] = (counts[q.source] || 0) + 1;
    const order = shuffle([0,1,2,3]);
    return { ...q, num:i+1, options:order.map(n => q.options[n]), ans:order.indexOf(q.ans) };
  });
  try { localStorage.setItem("cloud118.counts", JSON.stringify(counts)); } catch {}
  return exam;
}

history.replaceState({cloudBalanced118: QUESTIONS}, "");

const userAns = new Array(QUESTIONS.length).fill(null);
const userType = new Array(QUESTIONS.length).fill(null);
let seconds = 0;
let paused = false;
let submitted = false;

const timerInterval = setInterval(() => {
  if (!paused && !submitted) {
    seconds++;
    document.getElementById("timer").textContent = formatTime(seconds);
  }
}, 1000);

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function togglePause() {
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "재개" : "일시정지";
}

function renderQuiz() {
  const list = document.getElementById("quiz-list");
  const numCircles = ["①", "②", "③", "④"];
  list.innerHTML = QUESTIONS.map((item, idx) => `
    <div class="q-card" id="card-${idx}">
      <div class="q-meta">
        <span class="q-num">문제 ${item.num}</span>
        <span class="q-unit">${item.unit} · ${item.source}</span>
      </div>
      <div class="q-text">${item.q}</div>
      <div class="opt-list">
        ${item.options.map((opt, oIdx) => `
          <label class="opt-label" id="lbl-${idx}-${oIdx}">
            <input type="radio" name="q${idx}" value="${oIdx}" onchange="selectOpt(${idx}, ${oIdx})">
            <span>${numCircles[oIdx]} ${opt}</span>
          </label>
        `).join("")}
      </div>
      <div class="type-row">
        <span class="type-title">자가 유형 분류:</span>
        <div class="type-btns">
          ${["A", "B", "C", "D"].map(t => `
            <button type="button" class="t-btn" id="tbtn-${idx}-${t}" onclick="selectType(${idx}, '${t}')">${t}</button>
          `).join("")}
        </div>
      </div>
      <div class="exp-box" id="exp-${idx}">
        <b>정답: ${numCircles[item.ans]}</b><br>${item.exp}
      </div>
    </div>
  `).join("");
}

function selectOpt(qIdx, oIdx) {
  if (submitted) return;
  userAns[qIdx] = oIdx;
  for (let i = 0; i < 4; i++) {
    document.getElementById(`lbl-${qIdx}-${i}`).classList.toggle("selected", i === oIdx);
  }
  const done = userAns.filter(v => v !== null).length;
  document.getElementById("answered-count").textContent = `진행: ${done} / 35 문항`;
  document.getElementById("progress-fill").style.width = `${(done / 35) * 100}%`;
}

function selectType(qIdx, t) {
  userType[qIdx] = (userType[qIdx] === t) ? null : t;
  ["A", "B", "C", "D"].forEach(code => {
    document.getElementById(`tbtn-${qIdx}-${code}`).classList.toggle("active", userType[qIdx] === code);
  });
}

function gradeQuiz() {
  const unanswered = userAns.filter(v => v === null).length;
  if (unanswered > 0 && !confirm(`아직 풀지 않은 문제가 ${unanswered}개 있습니다. 그래도 제출하고 진단할까요?`)) {
    return;
  }
  submitted = true;
  document.querySelectorAll("input,.t-btn,.btn-submit,.btn-pause").forEach(control => control.disabled=true);
  clearInterval(timerInterval);

  let correctCnt = 0;
  const unitStats = {};
  const typeStats = { A: [], B: [], C: [], D: [] };
  const wrongList = [];

  QUESTIONS.forEach((item, idx) => {
    if (!unitStats[item.unit]) unitStats[item.unit] = { total: 0, ok: 0 };
    unitStats[item.unit].total++;

    const card = document.getElementById(`card-${idx}`);
    const exp = document.getElementById(`exp-${idx}`);
    exp.classList.add("show");

    const chosen = userAns[idx];
    const isOk = chosen === item.ans;
    if (isOk) {
      correctCnt++;
      unitStats[item.unit].ok++;
      card.classList.add("correct");
    } else {
      card.classList.add("wrong");
      wrongList.push(item.num + "번 (" + item.source + ")");
      if (chosen !== null) {
        document.getElementById(`lbl-${idx}-${chosen}`).classList.add("ans-bad");
      }
    }
    document.getElementById(`lbl-${idx}-${item.ans}`).classList.add("ans-ok");

    const finalType = userType[idx] || (isOk ? "A" : "B");
    typeStats[finalType].push(item.num);
  });

  const score = Math.round((correctCnt / 35) * 100);
  const avgSec = Math.round(seconds / 35);

  document.getElementById("stat-grid").innerHTML = `
    <div class="stat-box"><div class="stat-num">${correctCnt} / 35 (${score}점)</div><div class="stat-lbl">정답 수 및 환산 점수</div></div>
    <div class="stat-box"><div class="stat-num">${formatTime(seconds)}</div><div class="stat-lbl">총 소요 시간 (문항당 ${avgSec}초)</div></div>
    <div class="stat-box"><div class="stat-num">A:${typeStats.A.length} / B:${typeStats.B.length}</div><div class="stat-lbl">유형 A(완벽) / B(원리부족)</div></div>
    <div class="stat-box"><div class="stat-num">C:${typeStats.C.length} / D:${typeStats.D.length}</div><div class="stat-lbl">유형 C(생소) / D(계산·적용)</div></div>
  `;

  let unitHtml = "<h3 style='font-size:15px; margin:12px 0 6px;'>📚 단원별 성취도</h3><table class='mini-tbl' style='width:100%;'><tr><th>단원</th><th>정답/문항</th><th>정답률</th></tr>";
  const unitLines = [];
  for (const [u, st] of Object.entries(unitStats)) {
    const pct = Math.round((st.ok / st.total) * 100);
    unitHtml += `<tr><td style='text-align:left;'>${u}</td><td>${st.ok} / ${st.total}</td><td><b>${pct}%</b></td></tr>`;
    unitLines.push(`- ${u}: ${st.ok}/${st.total} (${pct}%)`);
  }
  unitHtml += "</table>";
  document.getElementById("unit-breakdown").innerHTML = unitHtml;

  const speedEval = avgSec <= 60 ? "빠름 (실전 시간 충분)" : avgSec <= 90 ? "적정 (계산 문항 시간 배분 유의)" : "다소 느림 (개념 정립 후 반복 숙달 필요)";

  const reportText = `[클라우드컴퓨팅 전 범위 모의시험 학습 진단 보고서]
1. 학습 범위 및 문항 수: 전 범위 35문항
2. 실제 풀이 시간: 총 ${formatTime(seconds)} (문항당 평균 ${avgSec}초)
3. 득점 결과: ${correctCnt} / 35문항 정답 (${score}점)
4. A~D 유형 분포:
   - A (개념 알고 품): ${typeStats.A.length}문항 ${typeStats.A.length ? '(' + typeStats.A.join(', ') + '번)' : ''}
   - B (원리 부족): ${typeStats.B.length}문항 ${typeStats.B.length ? '(' + typeStats.B.join(', ') + '번)' : ''}
   - C (개념 생소): ${typeStats.C.length}문항 ${typeStats.C.length ? '(' + typeStats.C.join(', ') + '번)' : ''}
   - D (계산·적용 막힘): ${typeStats.D.length}문항 ${typeStats.D.length ? '(' + typeStats.D.join(', ') + '번)' : ''}
5. 단원별 정답률:
${unitLines.join("\n")}
6. 오답 문항(재풀이 대상): ${wrongList.length ? wrongList.join(", ") : "없음 (만점)"}
7. 학습 속도 평가: ${speedEval}`;

  document.getElementById("report-textarea").value = reportText;
  const repSec = document.getElementById("report-section");
  repSec.style.display = "block";
  repSec.scrollIntoView({ behavior: "smooth" });
}
