<script>
const QUESTIONS = [{"num": 1, "unit": "1. 명령어와 주소지정방식", "q": "다음 중 컴퓨터 명령어를 구성하는 연산코드 필드(OP code field)에 대한 설명으로 가장 적절한 것은?", "options": ["기억장치 주소 혹은 처리장치 레지스터를 선택하기 위한 필드이다.", "중앙처리장치에서 수행할 연산을 지정하는 필드이다.", "명령어의 주소지정방식을 지정하는 필드이다.", "인터럽트 요청을 위한 제어 필드이다."], "ans": 1, "exp": "연산코드(OP code) 필드는 CPU가 수행해야 할 동작(ADD, LOAD, STORE 등)을 지정합니다."}, {"num": 2, "unit": "1. 명령어와 주소지정방식", "q": "다음 컴퓨터 명령어에 관한 설명으로 적절한 것은?<br><div class='code-box'>ADD X</div>", "options": ["2-주소 컴퓨터 명령어이다.", "데이터 전송을 위한 컴퓨터 명령어이다.", "컴퓨터의 내부구조로 볼 때 누산기를 이용하는 컴퓨터 명령어이다.", "컴퓨터의 내부구조로 볼 때 다중 레지스터를 이용하는 컴퓨터 명령어이다."], "ans": 2, "exp": "오퍼랜드가 X 하나뿐인 1-주소 명령어로, 단일 누산기(AC)와 M[X]를 더해 결과를 다시 AC에 저장합니다."}, {"num": 3, "unit": "1. 명령어와 주소지정방식", "q": "다음 프로그램을 보고 물음에 답하시오. 위의 프로그램은 다음 중 어느 수식을 계산하는 것인가?<br><table class='mini-tbl'><tr><th>명령어</th><th>동작</th><th>단계</th></tr><tr><td>LOAD A</td><td>AC ← M[A]</td><td>(a)</td></tr><tr><td>ADD B</td><td>AC ← AC + M[B]</td><td>(b)</td></tr><tr><td>STORE X</td><td>M[X] ← AC</td><td>(c)</td></tr><tr><td>LOAD C</td><td>AC ← M[C]</td><td>(d)</td></tr><tr><td>MUL X</td><td>AC ← AC × M[X]</td><td>(e)</td></tr><tr><td>STORE X</td><td>( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</td><td>(f)</td></tr></table>", "options": ["X = (A + B) × C", "X = C × (A × B)", "X = (A + B) / C", "X = (A × B) + C"], "ans": 0, "exp": "M[X]에 A+B를 저장한 뒤, AC에 C를 적재하고 M[X]를 곱하여 다시 M[X]에 저장하므로 X = (A + B) × C입니다."}, {"num": 4, "unit": "1. 명령어와 주소지정방식", "q": "위 (3번) 프로그램에서 (f)의 괄호 안에 들어갈 식으로 알맞은 것은?", "options": ["M[X] ← AC × AC", "AC ← AC × M[X]", "AC ← M[X]", "M[X] ← AC"], "ans": 3, "exp": "STORE X 명령어는 누산기(AC)의 값을 기억장치 X번지에 저장하므로 M[X] ← AC입니다."}, {"num": 5, "unit": "2. 마이크로연산과 버스", "q": "다음 중 산술연산에서 두 수를 가산할 때 결과를 저장할 수 있는 레지스터의 자릿수가 모자라는 경우에 발생하는 에러를 저장하는 상태 레지스터의 플래그(flag)는?", "options": ["sign bit", "zero bit", "overflow bit", "carry bit"], "ans": 2, "exp": "부호 있는 수의 가산에서 레지스터 표현 범위를 초과하여 부호 오류가 발생할 때 설정되는 플래그는 오버플로우 비트(V: overflow bit)입니다."}, {"num": 6, "unit": "2. 마이크로연산과 버스", "q": "다음 마이크로 연산에 관한 설명으로 잘못된 것은?<br><div class='code-box'>T₁ + T₂ : R0 ← R2' + 1, R3 ← R4 ∧ R5</div>", "options": ["T₁ + T₂ 은 두 변수의 OR 연산이다.", "R0에는 R2의 2의 보수가 저장된다.", "R0에는 R2의 1의 보수가 저장된다.", "R3에는 R4와 R5의 논리 곱연산 결과가 저장된다."], "ans": 2, "exp": "R2' + 1은 1의 보수(R2')에 1을 더한 것이므로 R2의 2의 보수입니다. 따라서 ③번이 잘못된 설명입니다."}, {"num": 7, "unit": "1. 명령어와 주소지정방식", "q": "PC의 현재 내용이 256이고 주소 필드의 값이 500, R1 = 400일 때, <b>즉치 주소지정방식</b>과 <b>직접 주소지정방식</b>을 이용한다면 각각 어떤 값이 AC에 적재될 것인가?<br><div class='mem-wrap'><table class='mini-tbl'><tr><th>레지스터</th><th>값</th></tr><tr><td>PC</td><td>256 (다음 명령어 258)</td></tr><tr><td>R1</td><td>400</td></tr><tr><td>주소필드</td><td>500</td></tr></table><table class='mini-tbl'><tr><th>번지</th><th>내용</th></tr><tr><td>256</td><td>연산코드 | 주소방식</td></tr><tr><td>257</td><td>ADRS, NBR = 500</td></tr><tr><td>258</td><td>다음 명령어</td></tr><tr><td>400</td><td>800</td></tr><tr><td>500</td><td>818</td></tr><tr><td>756</td><td>502</td></tr><tr><td>757</td><td>600</td></tr><tr><td>758</td><td>700</td></tr><tr><td>800</td><td>300</td></tr><tr><td>818</td><td>456</td></tr><tr><td>900</td><td>458</td></tr></table></div>", "options": ["257, 500", "456, 256", "500, 456", "500, 818"], "ans": 3, "exp": "즉치 방식은 주소 필드 값 자체(500)가 적재되고, 직접 방식은 500번지의 내용(818)이 적재됩니다."}, {"num": 8, "unit": "1. 명령어와 주소지정방식", "q": "위 (7번) 그림에서 <b>간접 주소지정방식</b>과 <b>상대 주소지정방식</b>을 이용한다면 각각의 유효주소는?", "options": ["818, 758", "818, 700", "500, 818", "500, 256"], "ans": 0, "exp": "간접 방식의 유효주소 = M[500] = 818. 상대 방식의 유효주소 = 다음 명령어 주소(PC=258) + 주소필드(500) = 758입니다."}, {"num": 9, "unit": "1. 명령어와 주소지정방식", "q": "위 (7번) 그림에서 <b>인덱스된 주소지정방식</b>과 <b>레지스터 간접 주소지정방식</b>을 이용한다면 각각의 유효주소는? (레지스터는 R1 사용)", "options": ["400, 500", "458, 500", "500, 400", "900, 400"], "ans": 3, "exp": "인덱스된 방식의 유효주소 = R1(400) + 주소필드(500) = 900. 레지스터 간접 방식의 유효주소 = R1의 값 = 400입니다."}, {"num": 10, "unit": "2. 마이크로연산과 버스", "q": "다음 중 내부 버스에 대한 설명으로 적절한 것은?", "options": ["기억장치와 중앙처리장치 사이의 데이터 전송을 위한 공통 선로의 집합이다.", "중앙처리장치 내부에서 정보를 전달할 수 있는 통로이다.", "멀티플렉서와 인코더를 이용하여 구성할 수 있다.", "입출력장치들을 내부적으로 연결할 수 있는 통로이다."], "ans": 1, "exp": "내부 버스는 CPU 내부의 레지스터들과 ALU 간 정보를 전달하는 공통 통로이며, 멀티플렉서와 디코더로 구성합니다."}, {"num": 11, "unit": "3. 처리장치와 제어장치", "q": "다음 제어단어의 각 필드(A, B, D, F, H)에 관한 설명 중에서 부적절한 것은?<br><table class='mini-tbl'><tr><th>비트</th><td>1~3</td><td>4~6</td><td>7~9</td><td>10~13</td><td>14~16</td></tr><tr><th>필드</th><td><b>A</b></td><td><b>B</b></td><td><b>D</b></td><td><b>F</b></td><td><b>H</b></td></tr></table>", "options": ["A와 B는 출발 레지스터를 선택하는 필드이다.", "D는 도착 레지스터를 선택하는 필드이다.", "F는 ALU에서 수행되는 연산의 하나를 선택하는 필드이다.", "H는 상태 레지스터의 상태 값을 선택하는 필드이다."], "ans": 3, "exp": "H 필드는 상태 레지스터가 아니라 시프터(Shifter)에서 수행될 시프트 연산을 선택하는 필드입니다."}, {"num": 12, "unit": "3. 처리장치와 제어장치", "q": "위의 제어단어(A:3비트, B:3비트, D:3비트, F:4비트, H:3비트)로부터 알 수 있는 사실로서 적절한 것은?", "options": ["A가 3비트이므로 외부 입력까지 고려한다면 레지스터 세트에는 최대한 8개의 레지스터가 포함될 수 있다.", "D가 3비트이므로 외부 출력까지 고려한다면 레지스터 세트에는 최대한 7개의 레지스터가 포함될 수 있다.", "F가 4비트이므로 시프터에서 이루어지는 연산의 종류가 최대한 16개이다.", "H가 3비트이므로 최대 8개의 상태 값이 존재한다."], "ans": 1, "exp": "D가 3비트(8가지 조합)이고 외부 출력(선택 안 함)을 포함하므로 레지스터 세트에는 최대 7개(R1~R7)의 레지스터가 포함될 수 있습니다."}, {"num": 13, "unit": "3. 처리장치와 제어장치", "q": "중앙처리장치에서 내부버스를 구성하는 방법은 멀티플렉서와 ( &nbsp;&nbsp;&nbsp;&nbsp; )를 이용한다. 처리장치 블록도에서 도착 레지스터를 선택하는 장치 <b>가</b>에 해당되는 것은?", "options": ["가 (Decoder)", "나 (Flag Register)", "다 (ALU)", "라 (Shifter)"], "ans": 0, "exp": "도착 레지스터의 Load 제어신호를 생성하여 선택하는 장치는 디코더(Decoder, 그림의 '가')입니다."}, {"num": 14, "unit": "3. 처리장치와 제어장치", "q": "처리장치 블록도에서 ALU 뒤에 연결된 <b>라(Shifter)</b>에 관한 설명으로 적절한 것은?", "options": ["출발 레지스터의 내용을 ALU로 보내는데 필요하다.", "도착 레지스터를 결정하는데 필요하다.", "상태비트를 보관하는데 필요하다.", "ALU의 결과를 비트 단위의 이동을 위해 필요하다."], "ans": 2, "exp": "[공식 정답표 확인: 3번] 기존 해설은 정답과 불일치할 수 있어 재검토가 필요합니다."}, {"num": 15, "unit": "3. 처리장치와 제어장치", "q": "처리장치에서 레지스터 세트에 <b>15개</b>의 레지스터가 있고, ALU는 <b>21개</b>의 연산, 시프터는 <b>7개</b>의 연산을 수행한다고 가정했을 때 제어단어는 총 몇 비트가 되겠는가?", "options": ["20", "22", "23", "24"], "ans": 0, "exp": "레지스터 15개(2⁴=16 → 4비트)가 A, B, D 3개 필드이므로 4×3=12비트, ALU 21개 연산(2⁵=32 → 5비트), 시프터 7개 연산(2³=8 → 3비트) → 총 12 + 5 + 3 = 20비트입니다."}, {"num": 16, "unit": "2. 마이크로연산과 버스", "q": "다음 중 시프트 마이크로연산의 설명으로 잘못된 것은?", "options": ["레지스터 내의 데이터를 시프트시키는 연산이다.", "데이터의 측면이동에 사용된다.", "연산의 종류로는 가산 시프트와 감산 시프트가 있다.", "왼쪽과 오른쪽 쉬프트에 있어서 입력비트는 0으로 가정한다."], "ans": 2, "exp": "시프트 연산에는 논리 시프트, 순환 시프트, 산술 시프트가 있으며 가산/감산 시프트라는 분류는 없습니다."}, {"num": 17, "unit": "3. 처리장치와 제어장치", "q": "마이크로프로그램 제어기 블록도에서 제어기억장치 ROM에 저장되는 1~16번 비트 <b>나</b>에 들어갈 내용으로 적절한 것은?<br><div class='diagram-box'>내부주소(7bit) / 외부주소(7bit) ─(MUX1)─▶ [가: CAR(7bit)] ──▶ [제어기억장치 ROM 128×27 (나)]</div>", "options": ["상태비트", "제어신호", "제어단어", "선택비트"], "ans": 0, "exp": "[공식 정답표 확인: 1번] 기존 해설은 정답과 불일치할 수 있어 재검토가 필요합니다."}, {"num": 18, "unit": "3. 처리장치와 제어장치", "q": "위 (17번) 그림에서 만일 MUX1에서 <b>가(CAR)</b>로 입력되는 데이터가 <b>8비트</b>이고 다른 것은 변동이 없다면 제어기억장치 ROM은 어떻게 바뀌는가?", "options": ["64 × 26", "128 × 27", "256 × 28", "512 × 28"], "ans": 2, "exp": "주소가 7비트에서 8비트로 바뀌면 단어 수는 2⁸ = 256개, 분기주소 필드도 1비트 증가하여 총 28비트가 되므로 256 × 28입니다."}, {"num": 19, "unit": "3. 처리장치와 제어장치", "q": "위 마이크로프로그램 제어기에서 <b>가(CAR)</b>와 <b>다(처리장치)</b>에 들어갈 내용으로 적절한 것은?", "options": ["처리장치, 제어장치", "시프터, 제어주소 레지스터", "제어주소 레지스터, 처리장치", "산술논리연산장치, 중앙처리장치"], "ans": 2, "exp": "가(CAR)는 제어기억장치 주소를 보관하는 제어주소 레지스터이고, 다는 16비트 제어단어를 받아 연산을 수행하는 처리장치입니다."}, {"num": 20, "unit": "3. 처리장치와 제어장치", "q": "다음과 같은 연산을 수행하려 할 때 제어기억장치의 27개 비트에 대한 설명으로 잘못된 것은?<br><div class='code-box'>R5 ← R6 + R3, if (C = 0) then (CAR ← 62) else (CAR ← CAR + 1)</div>", "options": ["1번~16번 비트는 마이크로연산 R5 ← R6 + R3 수행한다.", "17번 비트는 (0)₂이어야 한다.", "18~20번 비트는 캐리의 상태에 따라 결정된다.", "21~27번 비트는 조건문 if(C=0)를 수행한다."], "ans": 3, "exp": "21~27번 비트는 조건이 참일 때 점프할 분기 주소(62번지)를 저장하는 필드입니다. 조건문 선택은 18~20번(MUX2 선택)이 담당합니다."}, {"num": 21, "unit": "3. 처리장치와 제어장치", "q": "다음 중 마이크로프로그램에 관한 설명으로 부적절한 것은?", "options": ["마이크로명령어를 이용해서 작성된 프로그램을 말한다.", "펌웨어라고도 한다.", "소프트웨어 프로그램을 작성하는 것보다 용이하다.", "마이크로프로그램이 하드웨어와 소프트웨어의 중간 정도임을 의미한다."], "ans": 2, "exp": "마이크로프로그램은 하드웨어 제어 신호 수준에서 작성되므로 일반 고급언어 소프트웨어 프로그램보다 작성이 훨씬 까다롭습니다."}, {"num": 22, "uni : ["pipeline processor", "array processor", "multiple processor", "I/O processor"], "ans": 3, "exp": "병렬처리 시스템의 대표적 3가지는 파이프라인 처리기, 배열 처리기, 다중 처리기이며, I/O processor(채널)는 입출력 전담 프로세서입니다."}];
const userAns = new Array(QUESTIONS.length).fill(null);
const userType = new Array(QUESTIONS.length).fill(null);
let seconds = 0;
let paused = false;
let submitted = false;

const timerInterval = setInterval(() => {
  if (!paused && !submitted) {
    seconds++;
    document.getElementById("timer").textContent = formatTime(seconds);
  }
}, 1000);

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function togglePause() {
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "재개" : "일시정지";
}

function renderQuiz() {
  const list = document.getElementById("quiz-list");
  const numCircles = ["①", "②", "③", "④"];
  list.innerHTML = QUESTIONS.map((item, idx) => `
    <div class="q-card" id="card-${idx}">
      <div class="q-meta">
        <span class="q-num">문제 ${item.num}</span>
        <span class="q-unit">${item.unit}</span>
      </div>
      <div class="q-text">${item.q}</div>
      <div class="opt-list">
        ${item.options.map((opt, oIdx) => `
          <label class="opt-label" id="lbl-${idx}-${oIdx}">
            <input type="radio" name="q${idx}" value="${oIdx}" onchange="selectOpt(${idx}, ${oIdx})">
            <span>${numCircles[oIdx]} ${opt}</span>
          </label>
        `).join("")}
      </div>
      <div class="type-row">
        <span class="type-title">자가 유형 분류:</span>
        <div class="type-btns">
          ${["A", "B", "C", "D"].map(t => `
            <button type="button" class="t-btn" id="tbtn-${idx}-${t}" onclick="selectType(${idx}, '${t}')">${t}</button>
          `).join("")}
        </div>
      </div>
      <div class="exp-box" id="exp-${idx}">
        <b>정답: ${numCircles[item.ans]}</b><br>${item.exp}
      </div>
    </div>
  `).join("");
}

function selectOpt(qIdx, oIdx) {
  if (submitted) return;
  userAns[qIdx] = oIdx;
  for (let i = 0; i < 4; i++) {
    document.getElementById(`lbl-${qIdx}-${i}`).classList.toggle("selected", i === oIdx);
  }
  const done = userAns.filter(v => v !== null).length;
  document.getElementById("answered-count").textContent = `진행: ${done} / 35 문항`;
  document.getElementById("progress-fill").style.width = `${(done / 35) * 100}%`;
}

function selectType(qIdx, t) {
  userType[qIdx] = (userType[qIdx] === t) ? null : t;
  ["A", "B", "C", "D"].forEach(code => {
    document.getElementById(`tbtn-${qIdx}-${code}`).classList.toggle("active", userType[qIdx] === code);
  });
}

function gradeQuiz() {
  const unanswered = userAns.filter(v => v === null).length;
  if (unanswered > 0 && !confirm(`아직 풀지 않은 문제가 ${unanswered}개 있습니다. 그래도 제출하고 진단할까요?`)) {
    return;
  }
  submitted = true;
  clearInterval(timerInterval);

  let correctCnt = 0;
  const unitStats = {};
  const typeStats = { A: [], B: [], C: [], D: [] };
  const wrongList = [];

  QUESTIONS.forEach((item, idx) => {
    if (!unitStats[item.unit]) unitStats[item.unit] = { total: 0, ok: 0 };
    unitStats[item.unit].total++;

    const card = document.getElementById(`card-${idx}`);
    const exp = document.getElementById(`exp-${idx}`);
    exp.classList.add("show");

    const chosen = userAns[idx];
    const isOk = chosen === item.ans;
    if (isOk) {
      correctCnt++;
      unitStats[item.unit].ok++;
      card.classList.add("correct");
    } else {
      card.classList.add("wrong");
      wrongList.push(item.num);
      if (chosen !== null) {
        document.getElementById(`lbl-${idx}-${chosen}`).classList.add("ans-bad");
      }
    }
    document.getElementById(`lbl-${idx}-${item.ans}`).classList.add("ans-ok");

    const finalType = userType[idx] || (isOk ? "A" : "B");
    typeStats[finalType].push(item.num);
  });

  const score = Math.round((correctCnt / 35) * 100);
  const avgSec = Math.round(seconds / 35);

  document.getElementById("stat-grid").innerHTML = `
    <div class="stat-box"><div class="stat-num">${correctCnt} / 35 (${score}점)</div><div class="stat-lbl">정답 수 및 환산 점수</div></div>
    <div class="stat-box"><div class="stat-num">${formatTime(seconds)}</div><div class="stat-lbl">총 소요 시간 (문항당 ${avgSec}초)</div></div>
    <div class="stat-box"><div class="stat-num">A:${typeStats.A.length} / B:${typeStats.B.length}</div><div class="stat-lbl">유형 A(완벽) / B(원리부족)</div></div>
    <div class="stat-box"><div class="stat-num">C:${typeStats.C.length} / D:${typeStats.D.length}</div><div class="stat-lbl">유형 C(생소) / D(계산·적용)</div></div>
  `;

  let unitHtml = "<h3 style='font-size:15px; margin:12px 0 6px;'>📚 단원별 성취도</h3><table class='mini-tbl' style='width:100%;'><tr><th>단원</th><th>정답/문항</th><th>정답률</th></tr>";
  const unitLines = [];
  for (const [u, st] of Object.entries(unitStats)) {
    const pct = Math.round((st.ok / st.total) * 100);
    unitHtml += `<tr><td style='text-align:left;'>${u}</td><td>${st.ok} / ${st.total}</td><td><b>${pct}%</b></td></tr>`;
    unitLines.push(`- ${u}: ${st.ok}/${st.total} (${pct}%)`);
  }
  unitHtml += "</table>";
  document.getElementById("unit-breakdown").innerHTML = unitHtml;

  const speedEval = avgSec <= 60 ? "빠름 (실전 시간 충분)" : avgSec <= 90 ? "적정 (계산 문항 시간 배분 유의)" : "다소 느림 (개념 정립 후 반복 숙달 필요)";

  const reportText = `[2017학년도 2학기 기말시험 문제은행 학습 진단 보고서]
1. 학습 범위 및 문항 수: 전 범위 35문항
2. 실제 풀이 시간: 총 ${formatTime(seconds)} (문항당 평균 ${avgSec}초)
3. 득점 결과: ${correctCnt} / 35문항 정답 (${score}점)
4. A~D 유형 분포:
   - A (개념 알고 품): ${typeStats.A.length}문항 ${typeStats.A.length ? '(' + typeStats.A.join(', ') + '번)' : ''}
   - B (원리 부족): ${typeStats.B.length}문항 ${typeStats.B.length ? '(' + typeStats.B.join(', ') + '번)' : ''}
   - C (개념 생소): ${typeStats.C.length}문항 ${typeStats.C.length ? '(' + typeStats.C.join(', ') + '번)' : ''}
   - D (계산·적용 막힘): ${typeStats.D.length}문항 ${typeStats.D.length ? '(' + typeStats.D.join(', ') + '번)' : ''}
5. 단원별 정답률:
${unitLines.join("\n")}
6. 오답 문항(재풀이 대상): ${wrongList.length ? wrongList.join(", ") + "번" : "없음 (만점)"}
7. 학습 속도 평가: ${speedEval}`;

  document.getElementById("report-textarea").value = reportText;
  const repSec = document.getElementById("report-section");
  repSec.style.display = "block";
  repSec.scrollIntoView({ behavior: "smooth" });
}

function copyReport() {
  const ta = document.getElementById("report-textarea");
  ta.select();
  document.execCommand("copy");
  alert("진단 보고서가 클립보드에 복사되었습니다!");
}

renderQuiz();
document.querySelectorAll('.mini-tbl').forEach(tbl => {
  if (!tbl.closest('.mem-wrap') && !tbl.parentElement.classList.contains('tbl-wrap')) {
    const wrap = document.createElement('div');
    wrap.className = 'tbl-wrap';
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  }
});
</script>
</body>
</html>
