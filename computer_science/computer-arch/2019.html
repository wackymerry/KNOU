<script>
const QUESTIONS = [{"num": 1, "unit": "1. 명령어와 주소지정방식", "q": "다음 중 컴퓨터 명령어를 구성하는 연산코드 필드(OP code field)에 대한 설명으로 가장 적절한 것은?", "options": ["기억장치 주소 혹은 처리장치 레지스터를 선택하기 위한 필드이다.", "명령어의 주소지정방식을 지정하는 필드이다.", "중앙처리장치에서 수행할 연산을 지정하는 필드이다.", "인터럽트 요청을 위한 제어 필드이다."], "ans": 2, "exp": "연산코드(OP code) 필드는 CPU가 수행할 연산의 종류를 지정하는 필드입니다."}, {"num": 2, "unit": "1. 명령어와 주소지정방식", "q": "다음 컴퓨터 명령어에 관한 설명으로 적절한 것은?<br><div class='code-box'>ADD X</div>", "options": ["2-주소 컴퓨터 명령어이다.", "데이터 전송을 위한 컴퓨터 명령어이다.", "컴퓨터의 내부구조로 볼 때 누산기를 이용하는 컴퓨터 명령어이다.", "컴퓨터의 내부구조로 볼 때 다중 레지스터를 이용하는 컴퓨터 명령어이다."], "ans": 2, "exp": "ADD X는 오퍼랜드가 1개인 1-주소 명령어로 단일 누산기(AC)를 암묵적 피연산자 및 목적지로 사용합니다."}, {"num": 3, "unit": "1. 명령어와 주소지정방식", "q": "다음 프로그램을 보고 물음에 답하시오. 위의 프로그램은 다음 중 어느 수식을 계산하는 것인가?<br><table class='mini-tbl'><tr><th>명령어</th><th>동작</th><th>단계</th></tr><tr><td>LOAD A</td><td>( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</td><td>(a)</td></tr><tr><td>SUB B</td><td>AC ← AC - M[B]</td><td>(b)</td></tr><tr><td>STORE X</td><td>M[X] ← AC</td><td>(c)</td></tr><tr><td>LOAD C</td><td>( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</td><td>(d)</td></tr><tr><td>MUL X</td><td>AC ← AC × M[X]</td><td>(e)</td></tr><tr><td>STORE X</td><td>M[X] ← AC</td><td>(f)</td></tr></table>", "options": ["X = (A + B) × C", "X = (A - B) × C", "X = (A + B) / C", "X = (A - B) + C"], "ans": 1, "exp": "M[X]에 A-B를 저장하고, AC에 C를 적재한 뒤 M[X]와 곱하여 다시 M[X]에 저장하므로 X = (A - B) × C입니다."}, {"num": 4, "unit": "1. 명령어와 주소지정방식", "q": "위 (3번) 프로그램에서 (a)의 괄호 안에 들어갈 식으로 알맞은 것은?", "options": ["AC ← AC × M[X]", "AC ← M[A]", "AC ← M[X]", "M[X] ← AC"], "ans": 1, "exp": "LOAD A 명령어는 기억장치 A번지의 내용(M[A])을 누산기(AC)에 적재하므로 AC ← M[A]입니다."}, {"num": 5, "unit": "1. 명령어와 주소지정방식", "q": "위의 (3번) 프로그램과 관계가 깊은 명령어 형식은?", "options": ["3-주소 명령어", "2-주소 명령어", "1-주소 명령어", "0-주소 명령어"], "ans": 2, "exp": "모든 명령어가 1개의 주소 피연산자만 명시하고 있으므로 1-주소 명령어 형식입니다."}, {"num": 6, "unit": "1. 명령어와 주소지정방식", "q": "다음 중 컴퓨터 명령어와 컴퓨터의 내부구조와의 관계가 적절하게 연결된 것은?", "options": ["0-주소 명령 : 다중 레지스터를 이용한 구조", "1-주소 명령 : 단일 누산기를 이용한 구조", "2-주소 명령 : 스택을 이용한 구조", "3-주소 명령 : 프로그램 카운터를 이용한 구조"], "ans": 1, "exp": "0-주소는 스택 구조, 1-주소는 단일 누산기 구조, 2·3-주소는 다중 범용 레지스터 구조와 밀접합니다."}, {"num": 7, "unit": "1. 명령어와 주소지정방식", "q": "PC의 현재 내용이 256이고 주소 필드의 값이 500, R1 = 400일 때, <b>직접 주소지정방식</b>과 <b>간접 주소지정방식</b>을 이용한다면 각각의 유효주소는?<br><div class='mem-wrap'><table class='mini-tbl'><tr><th>레지스터</th><th>값</th></tr><tr><td>PC</td><td>256 (다음 명령어 258)</td></tr><tr><td>R1</td><td>400</td></tr><tr><td>주소필드</td><td>500</td></tr></table><table class='mini-tbl'><tr><th>번지</th><th>내용</th></tr><tr><td>256</td><td>연산코드 | 주소방식</td></tr><tr><td>257</td><td>ADRS, NBR = 500</td></tr><tr><td>258</td><td>다음 명령어</td></tr><tr><td>400</td><td>800</td></tr><tr><td>500</td><td>818</td></tr><tr><td>756</td><td>502</td></tr><tr><td>758</td><td>700</td></tr><tr><td>800</td><td>300</td></tr><tr><td>818</td><td>456</td></tr><tr><td>900</td><td>458</td></tr></table></div>", "options": ["500, 400", "500, 818", "818, 456", "818, 900"], "ans": 1, "exp": "직접 주소지정방식의 유효주소는 주소 필드 값 그 자체(500)이고, 간접 주소지정방식의 유효주소는 M[500]의 값인 818입니다."}, {"num": 8, "unit": "1. 명령어와 주소지정방식", "q": "위 (7번) 그림에서 <b>간접 주소지정방식</b>과 <b>상대 주소지정방식</b>을 이용한다면 각각 어떤 값이 AC에 적재될 것인가?", "options": ["456, 502", "456, 700", "500, 818", "818, 456"], "ans": 1, "exp": "간접 방식은 유효주소 818번지의 내용(456)이 적재되고, 상대 방식은 유효주소 258+500=758번지의 내용(700)이 적재됩니다."}, {"num": 9, "unit": "1. 명령어와 주소지정방식", "q": "위 (7번) 그림에서 <b>인덱스된 주소지정방식</b>과 <b>레지스터 주소지정방식</b>을 이용한다면 각각 어떤 값이 AC에 적재될 것인가? (레지스터는 R1 사용)", "options": ["458, 400", "500, 818", "800, 818", "900, 800"], "ans": 0, "exp": "인덱스된 방식은 유효주소 400+500=900번지의 내용(458)이 적재되고, 레지스터 방식은 R1의 값 자체(400)가 적재됩니다."}, {"num": 10, "unit": "2. 마이크로연산과 버스", "q": "상태 레지스터(Flag Register) 구조에서 산술논리연산장치(ALU)의 최상위 비트 캐리(Cₙ₊₁)와 출력 캐리(C_out)를 XOR 연산하여 저장하는 <b>가</b>에 들어갈 상태비트로 적절한 것은?", "options": ["부호 비트", "제로 비트", "캐리 비트", "오버플로우 비트"], "ans": 3, "exp": "최상위 비트 자리올림(Cₙ₊₁)과 그 이전 자리올림(C_out)의 배타적 논리합(XOR)으로 검출하는 상태비트는 오버플로우 비트(V)입니다."}, {"num": 11, "unit": "2. 마이크로연산과 버스", "q": "다음 중 내부 버스에 대한 설명으로 적절한 것은?", "options": ["중앙처리장치와 레지스터간의 데이터 전송을 위한 공통 선로의 집합이다.", "멀티플렉서와 ALU를 이용해서 구성할 수 있다.", "레지스터와 ALU를 이용해서 구성할 수 있다.", "중앙처리장치 내부에서 정보를 전달할 수 있는 경로이다."], "ans": 3, "exp": "내부 버스는 CPU 내부 구성요소 간 정보를 전달하는 공통 경로입니다. (멀티플렉서와 디코더로 구성)"}, {"num": 12, "unit": "2. 마이크로연산과 버스", "q": "다음 마이크로 연산에 관한 설명으로 적절한 것은?<br><div class='code-box'>T₁ + T₂ : R0 ← R1 + R2' + 1, R3 ← R4 ∨ R5</div>", "options": ["T₁ + T₂ 은 산술 마이크로 연산이다.", "R0에는 R1 - R2의 결과가 저장된다.", "모두 세 가지 마이크로 연산이 수행된다.", "R3에는 R4와 R5의 논리 곱연산 결과가 저장된다."], "ans": 1, "exp": "R1 + R2' + 1은 R1에 R2의 2의 보수를 더하는 연산이므로 뺄셈(R1 - R2) 결과가 R0에 저장됩니다. (∨는 논리 OR 연산)"}, {"num": 13, "unit": "3. 처리장치와 제어장치", "q": "중앙처리장치에서 내부버스를 구성하는 방법은 멀티플렉서와 ( &nbsp;&nbsp;&nbsp;&nbsp; )를 이용한다. 처리장치 블록도에서 도착 레지스터를 선택하는 장치 <b>가</b>에 해당되는 것은?", "options": ["가 (Decoder)", "나 (Flag Register)", "다 (ALU)", "라 (Shifter)"], "ans": 0, "exp": "멀티플렉서(출발지 선택)와 디코더(도착지 선택, 그림의 '가')를 이용해 내부 버스를 구성합니다."}, {"num": 14, "unit": "3. 처리장치와 제어장치", "q": "위 처리장치 블록도에서 ALU의 출력을 받아 이동시키는 <b>라(Shifter)</b>에 관한 설명으로 적절한 것은?", "options": ["출발 레지스터의 내용을 ALU로 보내는데 필요하다.", "도착 레지스터를 결정하는데 필요하다.", "상태비트를 보관하는데 필요하다.", "ALU의 결과를 비트 단위의 이동을 위해 필요하다."], "ans": 3, "exp": "시프터(Shifter)는 ALU 연산 결과 값을 비트 단위로 좌우 이동시키는 장치입니다."}, {"num": 15, "unit": "3. 처리장치와 제어장치", "q": "위 처리장치에서 레지스터 세트에 <b>15개</b>의 레지스터가 있고, ALU는 <b>21개</b>의 연산, 시프터는 <b>7개</b>의 연산을 수행한다고 가정했을 때 제어단어는 몇 비트가 되겠는가?", "options": ["20", "22", "23", "24"], "ans": 0, "exp": "A(4)+B(4)+D(4)+F(5)+H(3) = 20비트입니다."}, {"num": 16, "unit": "3. 처리장치와 제어장치", "q": "다음 중 처리장치에 있는 각 구성요소의 선택신호를 설명하는 것으로 잘못된 것은?", "options": ["처리장치에서 수행되는 마이크로연산을 선택하는 신호", "처리장치의 각 구성요소를 제어", "선택신호로서 특정 마이크로연산을 선택", "처리장치를 구동하는 클럭 신호"], "ans": 3, "exp": "선택신호(제어단어)는 MUX·디코더·ALU·시프터의 동작을 지정하는 신호이며, 동기화를 위한 클럭 신호와는 구분됩니다."}, {"num": 17, "unit": "3. 처리장치와 제어장치", "q": "제어단어의 각 필드(A, B, D, F, H)에 관한 설명 중으로 적절한 것은?<br><table class='mini-tbl'><tr><th>비트</th><td>1~3</td><td>4~6</td><td>7~9</td><td>10~13</td><td>14~16 const userAns = new Array(QUESTIONS.length).fill(null);
const userType = new Array(QUESTIONS.length).fill(null);
let seconds = 0;
let paused = false;
let submitted = false;

const timerInterval = setInterval(() => {
  if (!paused && !submitted) {
    seconds++;
    document.getElementById("timer").textContent = formatTime(seconds);
  }
}, 1000);

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function togglePause() {
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "재개" : "일시정지";
}

function renderQuiz() {
  const list = document.getElementById("quiz-list");
  const numCircles = ["①", "②", "③", "④"];
  list.innerHTML = QUESTIONS.map((item, idx) => `
    <div class="q-card" id="card-${idx}">
      <div class="q-meta">
        <span class="q-num">문제 ${item.num}</span>
        <span class="q-unit">${item.unit}</span>
      </div>
      <div class="q-text">${item.q}</div>
      <div class="opt-list">
        ${item.options.map((opt, oIdx) => `
          <label class="opt-label" id="lbl-${idx}-${oIdx}">
            <input type="radio" name="q${idx}" value="${oIdx}" onchange="selectOpt(${idx}, ${oIdx})">
            <span>${numCircles[oIdx]} ${opt}</span>
          </label>
        `).join("")}
      </div>
      <div class="type-row">
        <span class="type-title">자가 유형 분류:</span>
        <div class="type-btns">
          ${["A", "B", "C", "D"].map(t => `
            <button type="button" class="t-btn" id="tbtn-${idx}-${t}" onclick="selectType(${idx}, '${t}')">${t}</button>
          `).join("")}
        </div>
      </div>
      <div class="exp-box" id="exp-${idx}">
        <b>정답: ${numCircles[item.ans]}</b><br>${item.exp}
      </div>
    </div>
  `).join("");
}

function selectOpt(qIdx, oIdx) {
  if (submitted) return;
  userAns[qIdx] = oIdx;
  for (let i = 0; i < 4; i++) {
    document.getElementById(`lbl-${qIdx}-${i}`).classList.toggle("selected", i === oIdx);
  }
  const done = userAns.filter(v => v !== null).length;
  document.getElementById("answered-count").textContent = `진행: ${done} / 35 문항`;
  document.getElementById("progress-fill").style.width = `${(done / 35) * 100}%`;
}

function selectType(qIdx, t) {
  userType[qIdx] = (userType[qIdx] === t) ? null : t;
  ["A", "B", "C", "D"].forEach(code => {
    document.getElementById(`tbtn-${qIdx}-${code}`).classList.toggle("active", userType[qIdx] === code);
  });
}

function gradeQuiz() {
  const unanswered = userAns.filter(v => v === null).length;
  if (unanswered > 0 && !confirm(`아직 풀지 않은 문제가 ${unanswered}개 있습니다. 그래도 제출하고 진단할까요?`)) {
    return;
  }
  submitted = true;
  clearInterval(timerInterval);

  let correctCnt = 0;
  const unitStats = {};
  const typeStats = { A: [], B: [], C: [], D: [] };
  const wrongList = [];

  QUESTIONS.forEach((item, idx) => {
    if (!unitStats[item.unit]) unitStats[item.unit] = { total: 0, ok: 0 };
    unitStats[item.unit].total++;

    const card = document.getElementById(`card-${idx}`);
    const exp = document.getElementById(`exp-${idx}`);
    exp.classList.add("show");

    const chosen = userAns[idx];
    const isOk = chosen === item.ans;
    if (isOk) {
      correctCnt++;
      unitStats[item.unit].ok++;
      card.classList.add("correct");
    } else {
      card.classList.add("wrong");
      wrongList.push(item.num);
      if (chosen !== null) {
        document.getElementById(`lbl-${idx}-${chosen}`).classList.add("ans-bad");
      }
    }
    document.getElementById(`lbl-${idx}-${item.ans}`).classList.add("ans-ok");

    const finalType = userType[idx] || (isOk ? "A" : "B");
    typeStats[finalType].push(item.num);
  });

  const score = Math.round((correctCnt / 35) * 100);
  const avgSec = Math.round(seconds / 35);

  document.getElementById("stat-grid").innerHTML = `
    <div class="stat-box"><div class="stat-num">${correctCnt} / 35 (${score}점)</div><div class="stat-lbl">정답 수 및 환산 점수</div></div>
    <div class="stat-box"><div class="stat-num">${formatTime(seconds)}</div><div class="stat-lbl">총 소요 시간 (문항당 ${avgSec}초)</div></div>
    <div class="stat-box"><div class="stat-num">A:${typeStats.A.length} / B:${typeStats.B.length}</div><div class="stat-lbl">유형 A(완벽) / B(원리부족)</div></div>
    <div class="stat-box"><div class="stat-num">C:${typeStats.C.length} / D:${typeStats.D.length}</div><div class="stat-lbl">유형 C(생소) / D(계산·적용)</div></div>
  `;

  let unitHtml = "<h3 style='font-size:15px; margin:12px 0 6px;'>📚 단원별 성취도</h3><table class='mini-tbl' style='width:100%;'><tr><th>단원</th><th>정답/문항</th><th>정답률</th></tr>";
  const unitLines = [];
  for (const [u, st] of Object.entries(unitStats)) {
    const pct = Math.round((st.ok / st.total) * 100);
    unitHtml += `<tr><td style='text-align:left;'>${u}</td><td>${st.ok} / ${st.total}</td><td><b>${pct}%</b></td></tr>`;
    unitLines.push(`- ${u}: ${st.ok}/${st.total} (${pct}%)`);
  }
  unitHtml += "</table>";
  document.getElementById("unit-breakdown").innerHTML = unitHtml;

  const speedEval = avgSec <= 60 ? "빠름 (실전 시간 충분)" : avgSec <= 90 ? "적정 (계산 문항 시간 배분 유의)" : "다소 느림 (개념 정립 후 반복 숙달 필요)";

  const reportText = `[2019학년도 2학기 기말시험 문제은행 학습 진단 보고서]
1. 학습 범위 및 문항 수: 전 범위 35문항
2. 실제 풀이 시간: 총 ${formatTime(seconds)} (문항당 평균 ${avgSec}초)
3. 득점 결과: ${correctCnt} / 35문항 정답 (${score}점)
4. A~D 유형 분포:
   - A (개념 알고 품): ${typeStats.A.length}문항 ${typeStats.A.length ? '(' + typeStats.A.join(', ') + '번)' : ''}
   - B (원리 부족): ${typeStats.B.length}문항 ${typeStats.B.length ? '(' + typeStats.B.join(', ') + '번)' : ''}
   - C (개념 생소): ${typeStats.C.length}문항 ${typeStats.C.length ? '(' + typeStats.C.join(', ') + '번)' : ''}
   - D (계산·적용 막힘): ${typeStats.D.length}문항 ${typeStats.D.length ? '(' + typeStats.D.join(', ') + '번)' : ''}
5. 단원별 정답률:
${unitLines.join("\n")}
6. 오답 문항(재풀이 대상): ${wrongList.length ? wrongList.join(", ") + "번" : "없음 (만점)"}
7. 학습 속도 평가: ${speedEval}`;

  document.getElementById("report-textarea").value = reportText;
  const repSec = document.getElementById("report-section");
  repSec.style.display = "block";
  repSec.scrollIntoView({ behavior: "smooth" });
}

function copyReport() {
  const ta = document.getElementById("report-textarea");
  ta.select();
  document.execCommand("copy");
  alert("진단 보고서가 클립보드에 복사되었습니다!");
}

renderQuiz();
document.querySelectorAll('.mini-tbl').forEach(tbl => {
  if (!tbl.closest('.mem-wrap') && !tbl.parentElement.classList.contains('tbl-wrap')) {
    const wrap = document.createElement('div');
    wrap.className = 'tbl-wrap';
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  }
});
</script>
</body>
</html>
