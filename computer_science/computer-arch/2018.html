<script>
const QUESTIONS = [{"num":1,"unit":"1. 명령어와 주소지정방식","q":"다음 중 컴퓨터 명령어를 구성하는 대표적인 필드가 아닌 것은?","options":["기억장치주소 혹은 처리장치 레지스터를 선택하기 위한 주소 필드","주소필드에 대한 해석방법을 지정하는 방식 필드","수행할 연산을 나타내는 연산코드 필드","인터럽트 요청을 위한 제어 필드"],"ans":3,"exp":"명령어는 일반적으로 연산코드(OP code) 필드, 주소(Address) 필드, 방식(Mode) 필드로 구성됩니다. 인터럽트 요청은 별도의 하드웨어 신호선이나 상태 레지스터를 통해 처리됩니다."},{"num":2,"unit":"1. 명령어와 주소지정방식","q":"다음 컴퓨터 명령어에 관한 설명으로 적절한 것은?<br><div class='code-box'>AND R1, R2, R3</div>","options":["2-주소 컴퓨터 명령어이다.","데이터 전송을 위한 컴퓨터 명령어이다.","컴퓨터의 내부구조로 볼 때 누산기를 이용하는 컴퓨터 명령어이다.","컴퓨터의 내부구조로 볼 때 다중 레지스터를 이용하는 컴퓨터 명령어이다."],"ans":3,"exp":"오퍼랜드가 3개(R1, R2, R3)인 3-주소 명령어 형식이며, 여러 범용 레지스터를 사용하는 다중 레지스터 구조의 컴퓨터 명령어입니다."},{"num":3,"unit":"1. 명령어와 주소지정방식","q":"다음 프로그램을 보고 물음에 답하시오. 위 프로그램은 다음 중 어느 수식을 계산하는 것인가?<br><table class='mini-tbl'><tr><th>명령어</th><th>동작</th><th>단계</th></tr><tr><td>LOAD A</td><td>AC ← M[A]</td><td>(a)</td></tr><tr><td>SUB B</td><td>AC ← AC - M[B]</td><td>(b)</td></tr><tr><td>STORE X</td><td>( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</td><td>(c)</td></tr><tr><td>LOAD C</td><td>AC ← M[C]</td><td>(d)</td></tr><tr><td>MUL X</td><td>AC ← AC × M[X]</td><td>(e)</td></tr><tr><td>STORE X</td><td>( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</td><td>(f)</td></tr></table>","options":["X = (A + B) × C","X = (A - B) × C","AC = (A + B) × C","AC = (A - B) × C"],"ans":1,"exp":"(a)~(c)에서 M[X]에 A - B가 저장되고, (d)에서 AC에 C를 적재한 뒤 (e)에서 C × (A - B)를 계산하여 최종적으로 (f)에서 M[X]에 저장하므로 X = (A - B) × C입니다."},{"num":4,"unit":"1. 명령어와 주소지정방식","q":"위 (3번) 프로그램에서 (f)의 괄호 안에 들어갈 식으로 알맞은 것은?","options":["AC ← M[A] - M[B]","AC ← AC × M[X]","AC ← M[X]","M[X] ← AC"],"ans":3,"exp":"STORE X 명령어는 누산기(AC)에 있는 연산 결과를 기억장치의 X번지(M[X])에 저장하는 명령어이므로 M[X] ← AC가 맞습니다."},{"num":5,"unit":"1. 명령어와 주소지정방식","q":"위 (3번) 프로그램의 명령어 형식과 관계가 깊은 컴퓨터 내부구조는?","options":["누산기를 가진 구조","다중 레지스터를 가진 구조","스택을 가진 구조","프로그램 카운터를 가진 구조"],"ans":0,"exp":"오퍼랜드가 1개인 1-주소 명령어 형식은 단일 누산기(AC)를 중심으로 연산을 수행하는 구조입니다."},{"num":6,"unit":"1. 명령어와 주소지정방식","q":"아래 그림과 같이 PC의 현재 내용이 156이므로 곧 156번지의 명령어를 수행한다. 연산코드는 '해당 피연산자를 AC에 적재하라'이고 주소 필드의 값은 300, R1 = 200일 때, <b>즉치 주소지정방식</b>과 <b>직접 주소지정방식</b>을 이용한다면 각각 어떤 값이 AC에 적재될 것인가?<br><div class='mem-wrap'><table class='mini-tbl'><tr><th>레지스터</th><th>값</th></tr><tr><td>PC</td><td>156 (다음 명령어 158)</td></tr><tr><td>R1</td><td>200</td></tr><tr><td>주소필드</td><td>300</td></tr></table><table class='mini-tbl'><tr><th>번지</th><th>내용</th></tr><tr><td>156</td><td>연산코드 | 주소방식</td></tr><tr><td>157</td><td>ADRS, NBR = 300</td></tr><tr><td>158</td><td>다음 명령어</td></tr><tr><td>200</td><td>500</td></tr><tr><td>300</td><td>618</td></tr><tr><td>456</td><td>502</td></tr><tr><td>458</td><td>700</td></tr><tr><td>500</td><td>300</td></tr><tr><td>618</td><td>456</td></tr><tr><td>700</td><td>458</td></tr></table></div>","options":["300, 500","300, 618","618, 456","618, 458"],"ans":1,"exp":"즉치(Immediate) 방식은 주소 필드 값 자체(300)가 피연산자이고, 직접(Direct) 방식은 주소 필드가 가리키는 300번지의 내용(618)이 피연산자입니다."},{"num":7,"unit":"1. 명령어와 주소지정방식","q":"위 (6번) 그림에서 <b>레지스터 주소지정방식</b>과 <b>레지스터 간접 주소지정방식</b>을 이용한다면 각각 어떤 값이 AC에 적재될 것인가? (레지스터는 R1 사용)","options":["200, 500","500, 300","500, 618","618, 300"],"ans":0,"exp":"레지스터 방식은 R1의 값 자체인 200이 적재되고, 레지스터 간접 방식은 R1의 값(200)이 가리키는 기억장치 200번지의 내용인 500이 적재됩니다."},{"num":8,"unit":"1. 명령어와 주소지정방식","q":"위 (6번) 그림에서 <b>상대 주소지정방식</b>과 <b>인덱스된 주소지정방식</b>을 이용한다면 각각의 유효주소는? (인덱스 레지스터는 R1)","options":["458, 400","456, 500","458, 500","618, 300"],"ans":2,"exp":"상대 주소지정방식의 유효주소 = 다음 명령어 주소(PC=158) + 주소필드(300) = 458. 인덱스된 주소지정방식의 유효주소 = 인덱스 레지스터(R1=200) + 주소필드(300) = 500입니다."},{"num":9,"unit":"2. 마이크로연산과 버스","q":"다음 마이크로 연산에 관한 설명으로 올바른 것은?<br><div class='code-box'>Y·T₁ : R0 ← R0 + R1<br>Y'·T₁ : R0 ← R0 + R1' + 1</div>","options":["Y=1, T₁=1 일 때, R0에서 R1을 빼어 결과를 R0에 적재","Y=0, T₁=0 일 때, R0와 R1을 더하여 결과를 R0에 적재","Y=0, T₁=1 일 때, R0와 R1을 더하여 결과를 R0에 적재","Y=0, T₁=1 일 때, R0에서 R1을 빼어 결과를 R0에 적재"],"ans":3,"exp":"Y=0(즉 Y'=1), T₁=1 일 때 두 번째 제어조건이 참이 되어 R0 + (R1의 2의 보수) = R0 - R1 연산이 수행되어 R0에 저장됩니다."},{"num":10,"unit":"2. 마이크로연산과 버스","q":"다음 중 내부 버스에 대한 설명으로 올바르지 않은 것은?","options":["중앙처리장치 내부의 연산장치와 레지스터간의 데이터 전송을 위한 공통 선로의 집합이다.","멀티플렉서와 디코더를 이용해서 구성할 수 있다.","레지스터와 ALU를 이용해서 구성할 수 있다.","중앙처리장치 내부에서 정보를 전달할 수 있는 경로이다."],"ans":2,"exp":"CPU 내부 버스는 레지스터들의 출력을 선택하는 멀티플렉서(MUX)와 목적지 레지스터를 선택하는 디코더(Decoder)를 이용하여 구성합니다."},{"num":11,"unit":"3. 처리장치와 제어장치","q":"다음 그림은 제어단어의 각 필드를 나타내고 있다. 각 필드에 관한 설명 중으로 적절한 것은?<br><table class='mini-tbl'><tr><th>비트</th><td>1~3</td><td>4~6</td><td>7~9</td><td>10~13</td><td>14~16</td></tr><tr><th>필드</th><td><b>A</b></td><td><b>B</b></td><td><b>D</b></td><td><b>F</b></td><td><b>H</b></td></tr></table>","options":["A와 D는 출발 레지스터를 선택하는 필드이다.","B는 도착 레지스터를 선택하는 필드이다.","F는 상태 레지스터의 상태 값을 선택하는 필드이다.","H는 시프터에서 수행되는 연산의 하나를 선택하는 필드이다."],"ans":3,"exp":"A와 B는 출발(소스) 레지스터 선택, D는 도착(목적지) 레지스터 선택, F는 ALU 연산 선택, H는 시프터(Shifter) 연산 선택 필드입니다."},{"num":12,"unit":"3. 처리장치와 제어장치","q":"위 처리장치 블록도에서 ㉮와 ㉱에 해당하는 것은 각각 무엇인가?<div style=\"max-width:100%;overflow-x:auto;margin:14px 0\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 350\" role=\"img\" aria-label=\"문제 도식\" style=\"display:block;width:100%;max-width:480px;height:auto;font:14px sans-serif\" fill=\"none\" stroke=\"#34465b\" stroke-width=\"1.6\"><rect x=\"100\" y=\"24\" width=\"245\" height=\"40\" rx=\"3\" fill=\"#eff6ff\"/><text x=\"222.5\" y=\"49.0\" fill=\"#1e293b\" stroke=\"none\" text-anchor=\"middle\">레지스터 세트</text><rect x=\"40\" y=\"102\" width=\"82\" height=\"42\" rx=\"3\" fill=\"#eff6ff\"/><text x=\"81.0\" y=\"128.0\" fill=\"#1e293b\" stroke=\"none\" text-anchor=\"middle\">㉮ 디코더</text><rect x=\"40\" y=\"166\" width=\"82\" height=\"42\" rx=\"3\" fill=\"#eff6ff\"/><text x=\"81.0\" y=\"192.0\" fill=\"#1e293b\" stroke=\"none\" text-anchor=\"middle\">㉯ ALU</text><rect x=\"205\" y=\"102\" width=\"95\" height=\"42\" rx=\"3\" fill=\"#eff6ff\"/><text x=\"252.5\" y=\"128.0\" fill=\"#1e293b\" stroke=\"none\" text-anchor=\"middle\">MUX B</text><rect x=\"325\" y=\"102\" width=\"95\" height=\"42\" rx=\"3\" fill=\" const userAns = new Array(QUESTIONS.length).fill(null);
const userType = new Array(QUESTIONS.length).fill(null);
let seconds = 0;
let paused = false;
let submitted = false;

const timerInterval = setInterval(() => {
  if (!paused && !submitted) {
    seconds++;
    document.getElementById("timer").textContent = formatTime(seconds);
  }
}, 1000);

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function togglePause() {
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "재개" : "일시정지";
}

function renderQuiz() {
  const list = document.getElementById("quiz-list");
  const numCircles = ["①", "②", "③", "④"];

    <div class="q-card" id="card-${idx}">
      <div class="q-meta">
        <span class="q-num">문제 ${item.num}</span>
        <span class="q-unit">${item.unit}</span>
      </div>
      <div class="q-text">${item.q}</div>
      <div class="opt-list">
        ${item.options.map((opt, oIdx) => `
          <label class="opt-label" id="lbl-${idx}-${oIdx}">
            <input type="radio" name="q${idx}" value="${oIdx}" onchange="selectOpt(${idx}, ${oIdx})">
            <span>${numCircles[oIdx]} ${opt}</span>
          </label>
        `).join("")}
      </div>
      <div class="type-row">
        <span class="type-title">자가 유형 분류:</span>
        <div class="type-btns">
          ${["A", "B", "C", "D"].map(t => `
            <button type="button" class="t-btn" id="tbtn-${idx}-${t}" onclick="selectType(${idx}, '${t}')">${t}</button>
          `).join("")}
        </div>
      </div>
      <div class="exp-box" id="exp-${idx}">
        <b>정답: ${numCircles[item.ans]}</b><br>${item.exp}
      </div>
    </div>
  `).join("");
}

function selectOpt(qIdx, oIdx) {
  if (submitted) return;
  userAns[qIdx] = oIdx;
  for (let i = 0; i < 4; i++) {
    document.getElementById(`lbl-${qIdx}-${i}`).classList.toggle("selected", i === oIdx);
  }
  const done = userAns.filter(v => v !== null).length;
  document.getElementById("answered-count").textContent = `진행: ${done} / 35 문항`;
  document.getElementById("progress-fill").style.width = `${(done / 35) * 100}%`;
}

function selectType(qIdx, t) {
  userType[qIdx] = (userType[qIdx] === t) ? null : t;
  ["A", "B", "C", "D"].forEach(code => {
    document.getElementById(`tbtn-${qIdx}-${code}`).classList.toggle("active", userType[qIdx] === code);
  });
}

function gradeQuiz() {
  const unanswered = userAns.filter(v => v === null).length;
  if (unanswered > 0 && !confirm(`아직 풀지 않은 문제가 ${unanswered}개 있습니다. 그래도 제출하고 진단할까요?`)) {
    return;
  }
  submitted = true;
  clearInterval(timerInterval);

  let correctCnt = 0;
  const unitStats = {};
  const typeStats = { A: [], B: [], C: [], D: [] };
  const wrongList = [];

  QUESTIONS.forEach((item, idx) => {
    if (!unitStats[item.unit]) unitStats[item.unit] = { total: 0, ok: 0 };
    unitStats[item.unit].total++;

    const card = document.getElementById(`card-${idx}`);
    const exp = document.getElementById(`exp-${idx}`);
    exp.classList.add("show");

    const chosen = userAns[idx];
    const isOk = chosen === item.ans;
    if (isOk) {
      correctCnt++;
      unitStats[item.unit].ok++;
      card.classList.add("correct");
    } else {
      card.classList.add("wrong");
      wrongList.push(item.num);
      if (chosen !== null) {
        document.getElementById(`lbl-${idx}-${chosen}`).classList.add("ans-bad");
      }
    }
    document.getElementById(`lbl-${idx}-${item.ans}`).classList.add("ans-ok");

    const finalType = userType[idx] || (isOk ? "A" : "B");
    typeStats[finalType].push(item.num);
  });

  const score = Math.round((correctCnt / 35) * 100);
  const avgSec = Math.round(seconds / 35);

  document.getElementById("stat-grid").innerHTML = `
    <div class="stat-box"><div class="stat-num">${correctCnt} / 35 (${score}점)</div><div class="stat-lbl">정답 수 및 환산 점수</div></div>
    <div class="stat-box"><div class="stat-num">${formatTime(seconds)}</div><div class="stat-lbl">총 소요 시간 (문항당 ${avgSec}초)</div></div>
    <div class="stat-box"><div class="stat-num">A:${typeStats.A.length} / B:${typeStats.B.length}</div><div class="stat-lbl">유형 A(완벽) / B(원리부족)</div></div>
    <div class="stat-box"><div class="stat-num">C:${typeStats.C.length} / D:${typeStats.D.length}</div><div class="stat-lbl">유형 C(생소) / D(계산·적용)</div></div>
  `;

  let unitHtml = "<h3 style='font-size:15px; margin:12px 0 6px;'>📚 단원별 성취도</h3><table class='mini-tbl' style='width:100%;'><tr><th>단원</th><th>정답/문항</th><th>정답률</th></tr>";
  const unitLines = [];
  for (const [u, st] of Object.entries(unitStats)) {
    const pct = Math.round((st.ok / st.total) * 100);
    unitHtml += `<tr><td style='text-align:left;'>${u}</td><td>${st.ok} / ${st.total}</td><td><b>${pct}%</b></td></tr>`;
    unitLines.push(`- ${u}: ${st.ok}/${st.total} (${pct}%)`);
  }
  unitHtml += "</table>";
  document.getElementById("unit-breakdown").innerHTML = unitHtml;

  const speedEval = avgSec <= 60 ? "빠름 (실전 시간 충분)" : avgSec <= 90 ? "적정 (계산 문항 시간 배분 유의)" : "다소 느림 (개념 정립 후 반복 숙달 필요)";

  const reportText = `[2018학년도 2학기 기말시험 문제은행 학습 진단 보고서]
1. 학습 범위 및 문항 수: 전 범위 35문항
2. 실제 풀이 시간: 총 ${formatTime(seconds)} (문항당 평균 ${avgSec}초)
3. 득점 결과: ${correctCnt} / 35문항 정답 (${score}점)
4. A~D 유형 분포:
   - A (개념 알고 품): ${typeStats.A.length}문항 ${typeStats.A.length ? '(' + typeStats.A.join(', ') + '번)' : ''}
   - B (원리 부족): ${typeStats.B.length}문항 ${typeStats.B.length ? '(' + typeStats.B.join(', ') + '번)' : ''}
   - C (개념 생소): ${typeStats.C.length}문항 ${typeStats.C.length ? '(' + typeStats.C.join(', ') + '번)' : ''}
   - D (계산·적용 막힘): ${typeStats.D.length}문항 ${typeStats.D.length ? '(' + typeStats.D.join(', ') + '번)' : ''}
5. 단원별 정답률:
${unitLines.join("\n")}
6. 오답 문항(재풀이 대상): ${wrongList.length ? wrongList.join(", ") + "번" : "없음 (만점)"}
7. 학습 속도 평가: ${speedEval}`;

  document.getElementById("report-textarea").value = reportText;
  window.showScoreReceipt?.({correct: correctCnt, total: QUESTIONS.length, units: unitStats, report: document.getElementById("report-textarea").value});
  const repSec = document.getElementById("report-section");
  repSec.style.display = "block";
  repSec.scrollIntoView({ behavior: "smooth" });
}

function copyReport() {
  const ta = document.getElementById("report-textarea");
  ta.select();
  document.execCommand("copy");
  alert("진단 보고서가 클립보드에 복사되었습니다!");
}

renderQuiz();
document.querySelectorAll('.mini-tbl').forEach(tbl => {
  if (!tbl.closest('.mem-wrap') && !tbl.parentElement.classList.contains('tbl-wrap')) {
    const wrap = document.createElement('div');
    wrap.className = 'tbl-wrap';
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  }
});
</script>
<script src="../scores.js"></script>
</body>
</html>
